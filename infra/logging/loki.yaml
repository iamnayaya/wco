apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: wco-observability
  labels:
    app.kubernetes.io/name: loki
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 720h   # 30 days of logs
      max_query_lookback: 720h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/retention
      retention_enabled: true
      delete_request_store: filesystem
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: wco-observability
  labels:
    app.kubernetes.io/name: loki
spec:
  serviceName: loki-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      serviceAccountName: loki
      securityContext:
        fsGroup: 10001
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          args:
            - -config.file=/etc/loki/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: storage
              mountPath: /loki
          ports:
            - name: http
              containerPort: 3100
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki-gateway
  namespace: wco-observability
  labels:
    app.kubernetes.io/name: loki
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 80
      targetPort: 3100
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: wco-observability
  labels:
    app.kubernetes.io/name: loki
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: wco-observability
  labels:
    app.kubernetes.io/name: loki
