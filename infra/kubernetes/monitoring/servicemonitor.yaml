apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wco-services
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["backend", "webhook-handler", "ai-engine", "admin-dashboard"]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: ["__meta_kubernetes_service_label_app_kubernetes_io_name"]
          targetLabel: service
