apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Monitoring custom resources for the kube-prometheus-stack.
# Deployed as a separate ArgoCD app (namespace: wco-observability) so that the
# application base stays free of monitoring CRDs and can be rotated independently.
namespace: wco-observability

commonLabels:
  app.kubernetes.io/part-of: wco
  app.kubernetes.io/managed-by: argocd

resources:
  - servicemonitor.yaml
  - slo-prometheusrule.yaml
