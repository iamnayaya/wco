# Secret material is NEVER stored in this repo. In clusters it is provisioned by
# External Secrets Operator from AWS Secrets Manager (see infra/terraform for the
# SecretsManager + IAM that grants the controller read access).
#
# The ExternalSecrets below materialize `*secrets` Secrets that deployments
# reference via envFrom/secretKeyRef. Prefix "wco/{environment}/{service}".
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa   # IRSA role provided by the controller
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: "wco/prod/backend", property: database_url }
    - secretKey: REDIS_URL
      remoteRef: { key: "wco/prod/backend", property: redis_url }
    - secretKey: JWT_SECRET
      remoteRef: { key: "wco/prod/backend", property: jwt_secret }
    - secretKey: WHATSAPP_ACCESS_TOKEN
      remoteRef: { key: "wco/prod/backend", property: whatsapp_token }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: webhook-handler-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: webhook-handler-secrets
    creationPolicy: Owner
  data:
    - secretKey: WHATSAPP_VERIFY_TOKEN
      remoteRef: { key: "wco/prod/webhook-handler", property: whatsapp_verify }
    - secretKey: PAYSTACK_SECRET_KEY
      remoteRef: { key: "wco/prod/webhook-handler", property: paystack_secret }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-engine-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: ai-engine-secrets
    creationPolicy: Owner
  data:
    - secretKey: CLAUDE_API_KEY
      remoteRef: { key: "wco/prod/ai-engine", property: claude_api_key }
