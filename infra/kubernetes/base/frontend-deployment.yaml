apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      serviceAccountName: wco-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/wco/wco/frontend:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: frontend-config
                  key: api-url
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Next.js needs a writable dir for its image cache in standalone mode
          volumeMounts:
            - name: cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-dashboard
  labels:
    app.kubernetes.io/name: admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-dashboard
    spec:
      serviceAccountName: wco-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: admin-dashboard
          image: ghcr.io/wco/wco/admin-dashboard:latest
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: admin-secrets # ADMIN_API_TOKEN — never in a ConfigMap
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
