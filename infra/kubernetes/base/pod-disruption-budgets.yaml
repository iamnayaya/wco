# PDBs — survive node drains during business hours.
# WhatsApp commerce peaks 19:00–23:00 WAT; maintenance windows avoid it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: webhook-handler
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-handler
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
