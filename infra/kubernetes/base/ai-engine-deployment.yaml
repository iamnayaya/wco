apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-engine
  labels:
    app.kubernetes.io/name: ai-engine
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 100%   # LLM pods spin up fast; keep old counting while new warm
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: wco-ai-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-engine
      containers:
        - name: ai-engine
          image: ghcr.io/wco/wco/ai-engine:latest
          ports:
            - name: http
              containerPort: 5000
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: ai-engine-config
            - secretRef:
                name: ai-engine-secrets   # CLAUDE_API_KEY / OPENAI_API_KEY via ESO
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 40
---
# Scaled by KEDA on RabbitMQ queue depth (see hpa.yaml) — scale-to-zero guarded
# by minReplicaCount=2 to keep cold-start latency off the LLM path.
