apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-handler
  labels:
    app.kubernetes.io/name: webhook-handler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: webhook-handler
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: admin-dashboard
  labels:
    app.kubernetes.io/name: admin-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Ingress — public surface is exactly two hosts; everything else stays private.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wco-public
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Webhook endpoints need raw bodies for HMAC verification
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  rules:
    - host: app.wco.africa
      http:
        paths:
          - path: /api/webhooks/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: webhook-handler
                port:
                  number: 80
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.wco.africa
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 80
