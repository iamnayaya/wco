# Prometheus alert rules — the alerts that page, not the ones that nag.
groups:
  - name: wco-slo
    rules:
      # API availability SLO: 99.9% of requests < 500ms over 5m
      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{job="wco-backend"}[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "API p95 latency above 500ms for 10 minutes"

      # Webhook ingestion is revenue-critical: failures = lost orders
      - alert: WebhookIngestionErrors
        expr: |
          sum(rate(http_requests_total{job="wco-webhook-handler", status=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="wco-webhook-handler"}[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
          service: webhook-handler
        annotations:
          summary: "Webhook handler error rate above 1% — PSP/Meta retries incoming"

      # Outbox relay falling behind = events silently delayed
      - alert: OutboxBacklogGrowing
        expr: wco_outbox_pending_events > 1000
        for: 15m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Transactional outbox backlog above 1000 events"

      # DLQ non-empty always means a message failed twice already
      - alert: DeadLetterQueueNonEmpty
        expr: rabbitmq_queue_messages{queue=~"dead.*"} > 0
        for: 5m
        labels:
          severity: critical
          service: platform
        annotations:
          summary: "Messages are dying in the DLQ: {{ $labels.queue }}"

      - alert: AiQueueBacklog
        expr: rabbitmq_queue_messages{queue="ai-engine.messages"} > 200
        for: 15m
        labels:
          severity: warning
          service: ai-engine
        annotations:
          summary: "AI queue backlog — customers waiting on replies"

      - alert: DatabaseConnectionsHigh
        expr: sum(pg_stat_activity_count) > 400
        for: 10m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Postgres connection count approaching pool exhaustion"
