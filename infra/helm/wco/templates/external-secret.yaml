{{- if and .Values.externalSecrets.enabled .Values.backend.enabled }}
# Secrets are sourced from AWS Secrets Manager — values never live in this repo.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "wco.fullname" . }}-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: SecretStore
  target:
    name: {{ include "wco.fullname" . }}-backend-secrets
  data:
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.backend }}
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.backend }}
        property: redis_url
{{- end }}
