openapi: 3.1.0
info:
  title: WCO API — WhatsApp Commerce OS
  version: 1.0.0
  description: |
    Merchant-facing REST API (canonical) plus GraphQL aggregation endpoint.

    ## Conventions
    * **Tenancy** — every business resource is store-scoped. Send `X-Store-Id`
      when the principal belongs to more than one store.
    * **Errors** — stable machine codes in envelope `{code,message,requestId,details}`.
    * **Pagination** — cursor-first: `?cursor=&limit=` → `{items,meta:{nextCursor,hasMore}}`.
    * **Idempotency** — send `X-Idempotency-Key` on unsafe POSTs; replays return the
      original response for 24 h (`Idempotency-Replayed: true`).
    * **Money** — major-unit strings (`"1500.50"`) + ISO 4217 `currency`.
    * **Auth** — JWT Bearer (interactive), `X-API-Key` (store-scoped machines),
      OAuth2 client-credentials (partners).
  contact: { name: WCO Platform Team, email: api@wco.africa }
  license: { name: Proprietary }
externalDocs:
  url: https://docs.wco.africa/api
  description: Full documentation set
servers:
  - { url: 'https://api.wco.africa/api/v1', description: production }
  - { url: 'https://staging-api.wco.africa/api/v1', description: staging }
  - { url: 'http://localhost:4000/api/v1', description: local dev }

security:
  - bearerAuth: []
  - apiKeyAuth: []

tags:
  - { name: auth, description: Registration, sessions, password flows }
  - { name: users, description: Team management (merchant admins) }
  - { name: stores, description: Multi-store management }
  - { name: customers, description: CRM profiles & GDPR }
  - { name: products, description: Catalog, variants, stock }
  - { name: orders, description: Order lifecycle }
  - { name: messages, description: Threads & messaging }
  - { name: payments, description: Links, verification, refunds }
  - { name: payment-methods, description: Merchant payout accounts }
  - { name: deliveries, description: Fulfilment & tracking }
  - { name: delivery-providers, description: Logistics registry }
  - { name: subscriptions, description: Billing plans & lifecycle }
  - { name: ai-configs, description: AI brain settings & templates }
  - { name: analytics, description: Aggregated metrics }
  - { name: webhooks, description: Outbound subscription management }
  - { name: whatsapp, description: WhatsApp number management }
  - { name: platform, description: Health, status, metrics }
  - { name: graphql, description: Aggregation reads }

paths:
  /health:
    get:
      tags: [platform]
      summary: Liveness probe
      security: []
      responses:
        '200': { description: Process alive, headers: { Cache-Control: { schema: { type: string }, example: no-store } } }
  /status:
    get:
      tags: [platform]
      summary: Readiness — dependency health snapshot
      security: []
      responses:
        '200':
          description: Component statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded, down] }
                  checks:
                    type: object
                    additionalProperties: { type: object, properties: { status: { type: string }, latencyMs: { type: number } } }
        '503': { $ref: '#/components/responses/Error' }
  /metrics:
    get:
      tags: [platform]
      summary: Prometheus scrape endpoint (internal network only)
      security: []
      responses:
        '200': { description: text/plain exposition, content: { text/plain: { schema: { type: string } } } }

  # ───────────────────────────── AUTH ─────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      summary: Register merchant + owner user (+default store)
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
      responses:
        '201':
          description: Account created, tokens issued
          headers: { Location: { schema: { type: string }, example: /api/v1/users/usr_2nb } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AuthTokens' }
                  - type: object
                    properties: { user: { $ref: '#/components/schemas/MeProfile' } }
              example:
                accessToken: eyJhbGciOi…
                refreshToken: rt_9f2c…
                expiresIn: 900
                user: { id: usr_2nb, role: OWNER, stores: [{ id: str_001, name: My Shop }] }
        '409': { description: Email already registered, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: [auth]
      summary: Email + password login (tier auth)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LoginInput' } } } }
      responses:
        '200':
          description: Token pair + profile
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AuthTokens' }
                  - type: object
                    properties: { user: { $ref: '#/components/schemas/MeProfile' } }
        '401': { description: Bad credentials — identical for unknown email, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke refresh token family
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/RefreshInput' } } } }
      responses:
        '204': { description: Revoked }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token → new pair
      description: Single-use. Presenting a consumed token revokes the whole family → 401.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RefreshInput' } } } }
      responses:
        '200': { description: New pair, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Request password reset email (always 202 — no enumeration)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } } } }
      responses:
        '202': { description: Accepted if rate limits allow }
  /auth/password/confirm:
    post:
      tags: [auth]
      summary: Confirm reset with emailed token; revokes all sessions
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PasswordResetConfirm' } } } }
      responses:
        '204': { description: Password changed }
        '401': { description: Invalid/expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/me:
    get:
      tags: [auth]
      summary: Current session profile (+stores)
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/MeProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [auth]
      summary: Update own profile (PATCH alias supported)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }
      responses:
        '200': { description: Updated profile, content: { application/json: { schema: { $ref: '#/components/schemas/MeProfile' } } } }

  # ─────────────────────── AUTH v2 — verification, 2FA, OAuth, sessions ───────
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Request password reset email (always succeeds - no enumeration)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } } } } } }
      responses:
        '200': { description: Accepted; email sent only when the account exists }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/verify-email/request:
    post:
      tags: [auth]
      summary: Email a verification link (24h TTL); resends invalidate prior links
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Queued }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/verify-email/confirm:
    post:
      tags: [auth]
      summary: Claim an emailed verification token (single-use)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        '200': { description: Email verified }
        '422': { description: Invalid/expired/consumed token }
  /auth/verify-phone/request:
    post:
      tags: [auth]
      summary: SMS a 6-digit code (10m TTL, hashed at rest)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Queued via SMS provider }
        '422': { description: No phone on file }
  /auth/verify-phone/confirm:
    post:
      tags: [auth]
      summary: Verify the SMS code (max 5 attempts per code)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses:
        '200': { description: Phone verified }
        '422': { description: Wrong/expired code or attempts exhausted }
  /auth/2fa/setup:
    post:
      tags: [auth]
      summary: Begin TOTP enrollment → otpauth:// URI for authenticator apps
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: otpauth URI, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { otpauthUri: { type: string } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/2fa/enable:
    post:
      tags: [auth]
      summary: Confirm enrollment with a live TOTP; returns backup codes ONCE
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses:
        '200': { description: Enabled + 10 single-use backup codes (plaintext shown once) }
        '422': { description: Code did not verify }
  /auth/2fa/login:
    post:
      tags: [auth]
      summary: Complete a TOTP challenge issued by login
      description: Accepts a 6-digit TOTP or a backup code (backup burns on use). Challenges are single-use and expire after 5 minutes.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId, code], properties: { challengeId: { type: string }, code: { type: string } } } } } }
      responses:
        '200': { description: Token pair issued, content: { application/json: { schema: { $ref: '#/components/schemas/AuthTokens' } } } }
        '401': { description: Bad code or expired challenge }
  /auth/2fa/disable:
    post:
      tags: [auth]
      summary: Remove 2FA (requires current password)
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [password], properties: { password: { type: string } } } } } }
      responses:
        '200': { description: Disabled }
        '401': { description: Password confirmation failed }
  /auth/{provider}/start:
    get:
      tags: [auth]
      summary: Begin OAuth flow (google | facebook | apple)
      description: Returns consent URL with a one-time CSRF state (Redis, 10m). `?redirect=1` issues an HTTP redirect instead of JSON.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, facebook, apple] } }
      responses:
        '200': { description: 'JSON { authorizeUrl }', content: { application/json: { schema: { type: object } } } }
        '302': { description: Redirect mode }
        '503': { description: Provider not configured }
  /auth/{provider}/callback:
    get:
      tags: [auth]
      summary: OAuth callback — exchange code, link/create account, issue session
      description: Apple posts back (response_mode=form_post); POST is accepted too.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [google, facebook, apple] } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Session tokens (+created flag on first provisioning) }
        '201': { description: New merchant+user provisioned from the social profile }
        '422': { description: State CSRF mismatch / unknown provider }
  /auth/providers:
    get:
      tags: [auth]
      summary: Which OAuth providers are configured on this deployment
      security: []
      responses: { '200': { description: '{ google, facebook, apple } booleans' } }
  /auth/sessions:
    get:
      tags: [auth]
      summary: List active sessions (device/ip/lastUsed)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active refresh-token sessions, newest first }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Revoke one session
      security: [{ bearerAuth: [] }]
      parameters: [{ name: sessionId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Revoked }
        '404': { description: Not an active session of yours }
  /auth/sessions/revoke-all:
    post:
      tags: [auth]
      summary: Revoke all other sessions (keeps the caller's current one)
      security: [{ bearerAuth: [] }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string, description: Current refresh token - excluded from revocation } } } } } }
      responses:
        '200': { description: Number revoked }

  # ───────────────────────────── USERS / STORES ─────────────────────────────
  /users:
    get:
      tags: [users]
      summary: List team members (OWNER)
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { name: page, in: query, schema: { type: integer, minimum: 1 }, description: offset-style — bounded dataset }
      responses:
        '200':
          description: Team list
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/users/{id}':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [users]
      summary: Get team member (OWNER)
      responses:
        '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [users]
      summary: Update role/name/active (OWNER) — PATCH alias supported
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }
      responses:
        '200': { description: Updated user, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [users]
      summary: Deactivate member — audit-logged, sessions revoked
      responses:
        '204': { description: Deactivated }
        '409': { description: Last OWNER cannot be deactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /stores:
    get:
      tags: [stores]
      summary: Stores accessible to the principal
      responses:
        '200':
          description: Membership-filtered list
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Store' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [stores]
      summary: Create store (OWNER)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreCreate' } } } }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string }, example: /api/v1/stores/str_9xk } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } }
        '409': { description: Slug or WhatsApp number taken, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/stores/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    get:
      tags: [stores]
      summary: Get store (membership enforced)
      responses:
        '200': { description: Store, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [stores]
      summary: Update store settings (OWNER/ADMIN; PATCH alias). If-Match honored.
      parameters: [{ name: If-Match, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StoreCreate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Store' } } } }
        '409': { description: STALE_WRITE on If-Match mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [stores]
      summary: Archive store (OWNER) — data retained per retention policy
      responses:
        '204': { description: Archived }
  '/stores/{id}/api-keys':
    post:
      tags: [stores]
      summary: Issue store-scoped API key (OWNER) — raw key shown once
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string }, expiresAt: { $ref: '#/components/schemas/DateTime' } }
      responses:
        '201':
          description: Created key (raw shown exactly once)
          content:
            application/json:
              example: { id: tok_8ab, apiKey: wco_strde_9xKp2mVq…, prefix: wco_strde_, name: ERP sync }

  # ───────────────────────────── CUSTOMERS / PRODUCTS ─────────────────────────────
  /customers:
    get:
      tags: [customers]
      summary: List customers (offset pagination, v2)
      description: >-
        Filterable, sortable directory page. Sort keys are whitelisted
        (createdAt|name|totalSpent|ordersCount|lastOrderAt).
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: q, in: query, schema: { type: string }, description: name/waPhone/email substring search }
        - { name: tag, in: query, schema: { type: string } }
        - { name: segment, in: query, schema: { type: string } }
        - { name: marketingOptIn, in: query, schema: { type: boolean } }
        - { name: minSpent, in: query, schema: { type: number } }
        - { name: maxSpent, in: query, schema: { type: number } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, name, totalSpent, ordersCount, lastOrderAt], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  meta:
                    type: object
                    properties:
                      pagination: { $ref: '#/components/schemas/OffsetPageMeta' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [customers]
      summary: Create customer (AGENT+; API-key ok)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerCreate' } } } }
      responses:
        '201':
          description: Created
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } }
        '409': { description: Phone already exists in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  '/customers/search':
    get:
      tags: [customers]
      summary: Search customers (q required)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 20 } }
      responses:
        '200': { description: Matches, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Customer' } } } } } } }
        '422': { $ref: '#/components/responses/Error' }

  '/customers/export':
    get:
      tags: [customers]
      summary: Export directory as CSV (RFC 4180, UTF-8 BOM, formula-injection guarded)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
        '422': { $ref: '#/components/responses/Error' }

  '/customers/import':
    post:
      tags: [customers]
      summary: Bulk-import customers from CSV (multipart, <=10MB, phone column required)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Import report
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skippedDuplicates: { type: integer }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: integer, description: 1-based row incl header offset }
                        error: { type: string }
        '422': { $ref: '#/components/responses/Error' }

  '/customer-tags':
    get:
      tags: [customers]
      summary: List tag catalog for store
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Tags, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerTag' } } } } } } }
    post:
      tags: [customers]
      summary: Create tag (unique per store)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerTag' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerTag' } } } }
        '409': { description: Name already exists in store }

  '/customer-tags/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [customers]
      summary: Get tag
      responses:
        '200': { description: Tag, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerTag' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [customers]
      summary: Update tag (rename re-syncs denormalized customer arrays)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerTag' } } } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [customers]
      summary: Delete tag and strip it from every customer holding it
      responses:
        '200': { description: Deleted }

  '/customer-tags/{id}/customers/{customerId}':
    post:
      tags: [customers]
      summary: Assign tag to customer (syncs customers.tags array)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '201': { description: Customer with updated tags }
    delete:
      tags: [customers]
      summary: Remove tag from customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Customer with updated tags }

  '/customer-segments':
    get:
      tags: [customers]
      summary: List segments (system + manual)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Segments, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/CustomerSegment' } } } } } } }
    post:
      tags: [customers]
      summary: Create manual segment (rule optional; empty rule = manual membership only)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSegment' } } } }
      responses:
        '201': { description: Created }

  '/customer-segments/auto':
    post:
      tags: [customers]
      summary: Run AI segmentation engine (idempotent; cron-safe)
      description: >-
        Creates/refreshes the six system segments (VIP, FREQUENT, NEW, ONE_TIME,
        AT_RISK, DORMANT), diffs memberships, updates lastComputedAt and syncs
        the legacy customers.segment column.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Per-segment placement counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  perSegment:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        members: { type: integer }

  '/customer-segments/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [customers]
      summary: Get segment
      responses:
        '200': { description: Segment }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [customers]
      summary: Update segment (rule locked while isSystem)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerSegment' } } } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [customers]
      summary: Delete manual segment
      responses:
        '200': { description: Deleted }

  '/customer-segments/{id}/customers/{customerId}':
    post:
      tags: [customers]
      summary: Add customer to segment (idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '201': { description: Added }
    delete:
      tags: [customers]
      summary: Remove customer from segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Removed }

  '/customers/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [customers]
      summary: Get customer 360 profile
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { description: Not found in this store - never leaks existence }
    patch:
      tags: [customers]
      summary: Update customer profile/tags
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerUpdate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
    delete:
      tags: [customers]
      summary: GDPR Art.17 erasure - cascades notes/memberships; order ledger untouched
      responses:
        '200': { description: Deleted }

  '/customers/{id}/notes':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [customers]
      summary: List notes (pinned first, offset pagination)
      responses:
        '200': { description: Notes page }
    post:
      tags: [customers]
      summary: Add note (author = authenticated user)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 5000 }, pinned: { type: boolean, default: false } } } } } }
      responses:
        '201': { description: Created }

  '/customers/{id}/notes/{noteId}':
    put:
      tags: [customers]
      summary: Edit note
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: noteId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string }, pinned: { type: boolean } } } } } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [customers]
      summary: Delete note
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: noteId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Deleted }

  '/customers/{id}/orders':
    get:
      tags: [customers]
      summary: Customer order feed
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Orders (desc) }

  '/customers/{id}/messages':
    get:
      tags: [customers]
      summary: WhatsApp conversation timeline for this customer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Messages (desc) }

  '/customers/{id}/stats':
    get:
      tags: [customers]
      summary: Lifetime stats snapshot (LTV, AOV, recency)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId: { $ref: '#/components/schemas/Id' }
                  totalSpent: { $ref: '#/components/schemas/Money' }
                  ordersCount: { type: integer }
                  avgOrderValue: { type: number }
                  lastOrderAt: { $ref: '#/components/schemas/DateTime' }
                  firstOrderAt: { $ref: '#/components/schemas/DateTime' }

  /products:
    get:
      tags: [products]
      summary: List products
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DRAFT, OUT_OF_STOCK, ARCHIVED] } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: lowStock, in: query, schema: { type: boolean }, description: stockQuantity <= lowStockThreshold and trackStock }
        - { $ref: '#/components/parameters/SortBy' }
        - { $ref: '#/components/parameters/Order' }
      responses:
        '200':
          description: Page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [products]
      summary: Create product (AGENT+)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductCreate' } } } }
      responses:
        '201': { description: Created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { description: Duplicate SKU in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/products/search':
    get:
      tags: [products]
      summary: Search products (trigram/tsquery)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/SearchQ', required-for: search }
        - { $ref: '#/components/parameters/Limit', description: capped at 50 }
      responses:
        '200': { description: Results (cursor meta only), content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Product' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } }
  '/products/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [products]
      summary: Get product
      responses:
        '200': { description: Product, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [products]
      summary: Update product — PATCH alias; If-Match honored
      parameters: [{ name: If-Match, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductUpdate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '409': { description: STALE_WRITE or duplicate SKU, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [products]
      summary: Soft delete (order history intact)
      responses:
        '204': { description: Soft-deleted }
  '/products/{id}/variants':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Add variant
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantUpsert' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }
        '409': { description: Duplicate variant SKU, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/products/{id}/variants/{variantId}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: variantId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    put:
      tags: [products]
      summary: Update variant (PATCH alias)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VariantUpsert' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Variant' } } } }
    delete:
      tags: [products]
      summary: Remove variant (soft delete)
      responses:
        '204': { description: Removed }
  '/products/{id}/images':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Upload product image (multipart field "image", jpg/png/webp <= 5MB)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { image: { type: string, format: binary } }, required: [image] } } } }
      responses:
        '201': { description: Created (first upload becomes primary), content: { application/json: { schema: { $ref: '#/components/schemas/ProductImage' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  '/products/{id}/images/{imageId}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: imageId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    delete:
      tags: [products]
      summary: Delete image; promotes the next image if the primary was removed
      responses:
        '204': { description: Deleted }
  '/products/{id}/images/{imageId}/primary':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: imageId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Make this image the primary one (demotes siblings)
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/ProductImage' } } } }
  '/products/{id}/tags':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    put:
      tags: [products]
      summary: Replace the product's tag set by names (upserts unknown names)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagsReplaceInput' } } } }
      responses:
        '200': { description: Current tag list, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TagV2' } } } } }
  '/products/{id}/discounts':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Create a discount code scoped to the product's store
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDiscount' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ProductDiscount' } } } }
        '409': { description: Duplicate code in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/products/{id}/discounts/apply':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Price an amount through a discount code
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiscountApplyInput' } } } }
      responses:
        '200': { description: Priced result, content: { application/json: { schema: { type: object, properties: { originalAmount: { $ref: '#/components/schemas/Money' }, discountedAmount: { $ref: '#/components/schemas/Money' }, savings: { $ref: '#/components/schemas/Money' }, discountCode: { type: string } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  '/products/{id}/stock':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    patch:
      tags: [inventory]
      summary: Adjust stock by delta (RESTOCK/DAMAGE/CORRECTION) — floors at zero
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryAdjustInput' } } } }
      responses:
        '200': { description: Resulting product quantity, content: { application/json: { schema: { type: object, properties: { productId: { $ref: '#/components/schemas/Id' }, quantity: { type: integer } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  '/products/{id}/inventory/history':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [inventory]
      summary: Ledger entries for a product (newest first)
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InventoryEntry' } } } } }
  '/products/{id}/ai/describe':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Generate marketing copy (LLM when OPENAI_API_KEY is set, heuristic otherwise)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { tone: { type: string, enum: [friendly, professional, promotional] } } } } } }
      responses:
        '200': { description: Description, content: { application/json: { schema: { $ref: '#/components/schemas/AiDescribeResult' } } } }
  '/products/{id}/ai/price':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Suggest a price from cost/compareAt/stock signals; persists a PENDING suggestion
      responses:
        '201': { description: Suggestion stored, content: { application/json: { schema: { $ref: '#/components/schemas/AiPriceResult' } } } }
  '/products/{id}/ai/categorize':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    post:
      tags: [products]
      summary: Guess a category from keywords and assign it
      responses:
        '200': { description: Assigned category, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryV2' } } } }
  /products/stats:
    get:
      tags: [products]
      summary: Catalog rollup (counts by status, inventory value, top categories)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Stats, content: { application/json: { schema: { type: object, properties: { total: { type: integer }, active: { type: integer }, draft: { type: integer }, outOfStock: { type: integer }, archived: { type: integer }, inventoryValue: { $ref: '#/components/schemas/Money' }, avgPrice: { $ref: '#/components/schemas/Money' }, topCategories: { type: array, items: { type: object, properties: { name: { type: string }, count: { type: integer } } } } } } } } }
  /products/export:
    get:
      tags: [products]
      summary: Export catalog as CSV (same filters as list v2)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, DRAFT] } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: text/csv attachment, content: { text/csv: { schema: { type: string } } } }
  /products/import:
    post:
      tags: [products]
      summary: Bulk upsert products from CSV (matches by SKU; bad rows reported, good rows commit)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } }, required: [file] } } } }
      responses:
        '200': { description: Import report, content: { application/json: { schema: { $ref: '#/components/schemas/ImportReport' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/sync-whatsapp:
    post:
      tags: [products]
      summary: Push ACTIVE tracked-stock products to the WhatsApp catalog
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Sync report, content: { application/json: { schema: { $ref: '#/components/schemas/WaSyncReport' } } } }
  /product-categories:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [products]
      summary: List categories with product counts
      responses:
        '200': { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CategoryV2' } } } } }
    post:
      tags: [products]
      summary: Create category (unique name per store)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryV2' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryV2' } } } }
        '409': { description: Duplicate name in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/product-categories/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    patch:
      tags: [products]
      summary: Rename/recolor/re-describe category
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryV2' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/CategoryV2' } } } }
    delete:
      tags: [products]
      summary: Delete category (products detach automatically)
      responses:
        '204': { description: Deleted }
  /product-tags:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [products]
      summary: List tags with usage counts
      responses:
        '200': { description: Tags, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TagV2' } } } } }
    post:
      tags: [products]
      summary: Create tag (unique name per store)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagV2' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/TagV2' } } } }
        '409': { description: Duplicate name in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/product-tags/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    patch:
      tags: [products]
      summary: Update tag (renames propagate to tagged products)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagV2' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/TagV2' } } } }
    delete:
      tags: [products]
      summary: Delete tag and its links
      responses:
        '204': { description: Deleted }
  /inventory:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [inventory]
      summary: Stock levels across the store
      responses:
        '200': { description: Levels, content: { application/json: { schema: { type: array, items: { type: object, properties: { productId: { $ref: '#/components/schemas/Id' }, name: { type: string }, sku: { type: string }, quantity: { type: integer }, lowStockThreshold: { type: integer }, trackStock: { type: boolean } } } } } } }
  /inventory/low-stock:
    parameters:
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [inventory]
      summary: Tracked products at or below their low-stock threshold
      responses:
        '200': { description: Low-stock products, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Product' } } } } }

  # ───────────────────────────── ORDERS ─────────────────────────────
  /orders:
    get:
      tags: [orders]
      summary: List orders (cursor pagination)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string }, description: comma-multi-valued OrderStatus }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: createdAfter, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/SortBy' }
        - { $ref: '#/components/parameters/Order' }
      responses:
        '200':
          description: Page (default sort -createdAt)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Order' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
        '422': { $ref: '#/components/responses/Error' }
    post:
      tags: [orders]
      summary: Create order (AGENT+; decrements stock atomically)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreate' } } } }
      responses:
        '201':
          description: Created with computed totals
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } }
        '409': { description: INSUFFICIENT_STOCK (details list offending items), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Error' }
  '/orders/stats':
    get:
      tags: [orders]
      summary: Order statistics (60 s Redis cache)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
      responses:
        '200': { description: Stats, headers: { Cache-Control: { schema: { type: string }, example: 'private, max-age=30' } }, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStats' } } } }
  '/orders/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [orders]
      summary: Get order
      responses:
        '200': { description: Order, headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [orders]
      summary: Update mutable fields (address/notes) — PATCH alias; only while PENDING_PAYMENT
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCreate', description: subset — items immutable post-creation } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: Illegal in current status, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [orders]
      summary: Cancel order while PENDING_PAYMENT (terminal states → PUT /status instead)
      responses:
        '204': { description: Cancelled }
        '409': { description: Not cancellable at this stage, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/items':
    get:
      tags: [orders]
      summary: Line items with snapshots
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Items
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
  '/orders/{id}/status':
    put:
      tags: [orders]
      summary: Transition status (state machine enforced; PATCH alias)
      description: |
        Allowed transitions:
        PENDING_PAYMENT→PAID|CANCELLED · PAID→PROCESSING|REFUNDED ·
        PROCESSING→SHIPPED|CANCELLED · SHIPPED→DELIVERED · terminal otherwise.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatusUpdate' } } } }
      responses:
        '200': { description: New status applied, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: Illegal transition or stale If-Match, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/v2':
    get:
      tags: [orders]
      summary: List orders (offset pagination; stable for dashboards)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt_asc, createdAt_desc, total_asc, total_desc] } }
        - { name: q, in: query, schema: { type: string }, description: order number suffix, customer name or phone digits }
      responses:
        '200':
          description: Page with totals
          content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
        '422': { $ref: '#/components/responses/Error' }
  '/orders/search':
    get:
      tags: [orders]
      summary: Search orders (same contract as /orders/v2; explicit search alias)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Matches, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }
  '/orders/export':
    get:
      tags: [orders]
      summary: CSV export (UTF-8 BOM; same filters as /orders)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: text/csv stream, content: { text/csv: { schema: { type: string } } } }
  '/orders/import':
    post:
      tags: [orders]
      summary: Bulk import through checkout semantics (AGENT+)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } }, required: [file] } } } }
      responses:
        '200':
          description: '{queued, imported, failedRows:[{row,error}] - bad rows isolated}'
          content: { application/json: { schema: { type: object } } }
        '422': { description: Missing file or wrong MIME type, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/status-history':
    get:
      tags: [orders]
      summary: Audit trail of status moves
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Oldest-first rows ({fromStatus,toStatus,actorId,at}), content: { application/json: { schema: { type: array, items: { type: object } } } } }
  '/orders/{id}/current-status':
    get:
      tags: [orders]
      summary: Current status with lifecycle timestamp
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: '{status, since}', content: { application/json: { schema: { type: object } } } }
  '/orders/{id}/timeline':
    get:
      tags: [orders]
      summary: Merged feed (status moves, notes, refunds) oldest-first
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Unified event feed, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  '/orders/{id}/items/{itemId}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [orders]
      summary: Single line item with snapshot
      responses:
        '200': { description: Item, content: { application/json: { schema: { $ref: '#/components/schemas/OrderItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [orders]
      summary: Update quantity/note - resyncs totals and stock atomically (order:write)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { quantity: { type: integer, minimum: 1, maximum: 999 }, note: { type: string } } } } } }
      responses:
        '200': { description: Resynchronized order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: INSUFFICIENT_STOCK for raises beyond availability, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [orders]
      summary: Remove a line (restores units; refuses to strand an order without lines)
      responses:
        '200': { description: Resynchronized order, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: Last remaining line, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/notes':
    get:
      tags: [orders]
      summary: Team notes (pinned first, then newest)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Notes, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [orders]
      summary: Add a note (author recorded; order:write)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string, minLength: 1, maxLength: 5000 }, pinned: { type: boolean } }, required: [body] } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object } } } }
        '422': { $ref: '#/components/responses/Error' }
  '/orders/{id}/notes/{noteId}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: noteId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [orders]
      summary: Fetch one note
      responses:
        '200': { description: Note, content: { application/json: { schema: { type: object } } } }
    put:
      tags: [orders]
      summary: Edit (author or OWNER/ADMIN only)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { body: { type: string }, pinned: { type: boolean } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object } } } }
        '403': { description: Not the author, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [orders]
      summary: Delete (author or OWNER/ADMIN only)
      responses:
        '200': { description: '{deleted:true}' }
  '/orders/{id}/refunds':
    get:
      tags: [orders]
      summary: Refund ledger for the order (team-readable)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Refunds, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [orders]
      summary: Record a refund intent (OWNER/ADMIN; validates unpaid balance)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { amount: { type: number }, reason: { type: string }, provider: { type: string } }, required: [amount] } } } }
      responses:
        '201': { description: Refund row (PENDING), content: { application/json: { schema: { type: object } } } }
        '403': { description: AGENT/VIEWER, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Order not paid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Over refundable balance, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/refunds/{refundId}/process':
    post:
      tags: [orders]
      summary: Execute a PENDING refund through its rail (OWNER/ADMIN; immutable once SUCCEEDED/FAILED)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Processed; full coverage drives the order REFUNDED, content: { application/json: { schema: { type: object } } } }
        '409': { description: Already processed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/refunds/{refundId}':
    put:
      tags: [orders]
      summary: Edit while PENDING only (OWNER/ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { amount: { type: number }, reason: { type: string } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object } } } }
        '409': { description: No longer pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [orders]
      summary: Void while PENDING only (OWNER/ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: '{deleted:true}' }
        '409': { description: No longer pending, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/cancellations':
    get:
      tags: [orders]
      summary: Cancellation records for the order
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Records, content: { application/json: { schema: { type: array, items: { type: object } } } } }
    post:
      tags: [orders]
      summary: Cancel with an audited record (OWNER/ADMIN; restock decided at process time)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reason: { type: string }, restock: { type: boolean } }, required: [reason] } } } }
      responses:
        '201': { description: Created; order moves CANCELLED, content: { application/json: { schema: { type: object } } } }
        '403': { description: AGENT/VIEWER, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Delivered orders route to refunds instead; duplicate record, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/orders/{id}/cancellations/{cancellationId}/process':
    post:
      tags: [orders]
      summary: Execute restock per record flags (OWNER/ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cancellationId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Processed, content: { application/json: { schema: { type: object } } } }
  '/orders/{id}/cancellations/{cancellationId}':
    patch:
      tags: [orders]
      summary: Amend reason (OWNER/ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cancellationId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { reason: { type: string } }, required: [reason] } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { type: object } } } }
    delete:
      tags: [orders]
      summary: Remove the record (OWNER/ADMIN)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: cancellationId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: '{deleted:true}' }
  '/orders/{id}/ai/predict-fulfillment':
    post:
      tags: [orders]
      summary: Predict fulfillment days with explainable basis (heuristic without OPENAI_API_KEY)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '201': { description: '{predictedDays, confidence, basis[], source}', content: { application/json: { schema: { type: object } } } }
  '/orders/{id}/ai/fraud-check':
    post:
      tags: [orders]
      summary: Weighted risk signals (HIGH_VALUE, NEW_CUSTOMER_HIGH_VALUE, NO_ADDRESS, BULK, ROUND_AMOUNT); persists fraudScore
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '201': { description: '{riskScore 0-100, level LOW|MEDIUM|HIGH, signals[], flaggedForReview}', content: { application/json: { schema: { type: object } } } }
  '/orders/sync-whatsapp':
    post:
      tags: [orders]
      summary: Queue open orders for WhatsApp notifications via transport seam (order:write)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: '{queued, skippedClosed, failed}', content: { application/json: { schema: { type: object } } } }

  # ───────────────────────────── MESSAGING ─────────────────────────────
  /messages/threads:
    get:
      tags: [messages]
      summary: List threads (backed by conversations; legacy alias /conversations)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit', default-value-50: true }
        - { name: status, in: query, schema: { type: string, enum: [BOT, HANDLED, CLOSED] } }
        - { name: unassigned, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Threads page (default sort -lastMessageAt)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MessageThread' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
  '/messages/threads/{id}':
    get:
      tags: [messages]
      summary: Thread detail + recent messages
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Thread + messages (marks read server-side)
          content:
            application/json:
              schema:
                type: object
                properties:
                  thread: { $ref: '#/components/schemas/MessageThread' }
                  items: { type: array, items: { $ref: '#/components/schemas/ThreadMessage' } }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [messages]
      summary: Send message as agent (flips BOT → HANDLED)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendMessageInput' } } } }
      responses:
        '201': { description: Queued for WhatsApp Cloud send, content: { application/json: { schema: { $ref: '#/components/schemas/ThreadMessage' } } } }
        '503': { description: PROVIDER_UNAVAILABLE — Meta down, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /messages/stats:
    get:
      tags: [messages]
      summary: Messaging statistics
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
      responses:
        '200': { description: Stats, content: { application/json: { schema: { $ref: '#/components/schemas/MessageStats' } } } }
  /messages:
    get:
      tags: [messages]
      summary: Flat message feed (most recent messages across all threads)
      description: Offset pagination. Ordered by createdAt desc.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: direction, in: query, schema: { type: string, enum: [INBOUND, OUTBOUND] } }
        - { name: sentByBot, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED, RECEIVED] } }
        - { name: type, in: query, schema: { type: string, enum: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT, LOCATION, TEMPLATE, INTERACTIVE] } }
      responses:
        '200':
          description: Messages page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Message' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  /messages/search:
    get:
      tags: [messages]
      summary: Full-text search across messages (body text + customer name)
      description: Offset pagination. Min query length: 2 chars.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { $ref: '#/components/parameters/Limit' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: Matching messages
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Message' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  /messages/export:
    get:
      tags: [messages]
      summary: Export messages to CSV (30-day max range)
      description: Returns a CSV file download.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema: { type: string, format: binary }
        '400': { description: Range exceeds 30 days, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /messages/send:
    post:
      tags: [messages]
      summary: Send message from backend queue (agent-initiated, no conversation context)
      description: Queues message for WhatsApp Cloud delivery. Useful for proactive agent outreach.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SendMessageInput'
                - type: object
                  required: [recipientPhone]
                  properties:
                    recipientPhone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
                    conversationId: { $ref: '#/components/schemas/Id', description: optional — link to existing thread }
      responses:
        '201': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '503': { description: PROVIDER_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /messages/receive:
    post:
      tags: [messages]
      summary: Receive inbound message (webhook receiver — called by Meta or internal pipeline)
      description: Persists inbound message, triggers AI auto-responder pipeline.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveMessageInput' }
      responses:
        '201': { description: Persisted, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '400': { description: Invalid payload, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/messages/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [messages]
      summary: Get single message by ID
      responses:
        '200': { description: Message, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [messages]
      summary: Update message metadata — PATCH alias
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageUpdateInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Message' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [messages]
      summary: Soft-delete message
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  '/messages/{id}/attachments':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [messages]
      summary: List attachments for a message
      responses:
        '200':
          description: Attachments
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MessageAttachment' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [messages]
      summary: Upload attachment to a message
      description: multipart/form-data upload; max 16 MB per file.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                mimeType: { type: string }
                fileName: { type: string }
      responses:
        '201': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/MessageAttachment' } } } }
        '413': { description: File exceeds 16 MB, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/messages/{id}/attachments/{attachmentId}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: attachmentId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    delete:
      tags: [messages]
      summary: Delete an attachment
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  '/messages/intents':
    get:
      tags: [messages]
      summary: List AI intent rules (store + system where storeId null)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: isActive, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Intents
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AiIntent' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [messages]
      summary: Create custom intent rule
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiIntentCreateInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AiIntent' } } } }
        '409': { description: Duplicate intent name in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/messages/intents/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    put:
      tags: [messages]
      summary: Update intent rule (PATCH alias)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiIntentCreateInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AiIntent' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [messages]
      summary: Delete intent rule (system intents → 403)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  '/messages/escalations':
    get:
      tags: [messages]
      summary: List escalation tickets
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, DISMISSED] } }
        - { name: priority, in: query, schema: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] } }
      responses:
        '200':
          description: Escalations page (cursor pagination, default sort -createdAt)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/MessageEscalation' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [messages]
      summary: Create escalation ticket (agent or auto-responder)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiEscalationInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEscalation' } } } }
        '409': { description: Active escalation already exists for this conversation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/messages/escalations/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [messages]
      summary: Get escalation detail
      responses:
        '200': { description: Escalation, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEscalation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [messages]
      summary: Update escalation (assign, resolve, dismiss) — PATCH alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [IN_PROGRESS, RESOLVED, DISMISSED] }
                priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
                assignedToUserId: { $ref: '#/components/schemas/Id' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEscalation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  '/messages/escalations/{id}/resolve':
    post:
      tags: [messages]
      summary: Resolve an escalation (sets resolvedByUserId + resolvedAt)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: resolution note }
      responses:
        '200': { description: Resolved, content: { application/json: { schema: { $ref: '#/components/schemas/MessageEscalation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  '/whatsapp/connection':
    get:
      tags: [whatsapp]
      summary: Get WhatsApp connection for store
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: Connection, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConnection' } } } }
        '404': { description: No connection, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/whatsapp/connect':
    post:
      tags: [whatsapp]
      summary: Connect WhatsApp number to store (OWNER)
      description: Number is globally unique. Stores Meta phone_number_id + encrypted access token.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsappConnectInput' } } } }
      responses:
        '201': { description: Connected; webhook subscription with Meta registered automatically, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConnection' } } } }
        '409': { description: Number already connected platform-wide, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/whatsapp/status':
    get:
      tags: [whatsapp]
      summary: Connection status incl. Meta quality rating
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/WhatsAppConnection' } } } }
  '/whatsapp/disconnect':
    post:
      tags: [whatsapp]
      summary: Disconnect number (OWNER) — pauses AI replies & campaign sends
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Disconnected }

  # ───────────────────────────── PAYMENTS / PAYMENT METHODS ─────────────────────────────
  /payments:
    get:
      tags: [payments]
      summary: List payments (offset pagination with filters)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, REFUNDED, ABANDONED] } }
        - { name: provider, in: query, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY, BANK_TRANSFER, CASH] } }
        - { name: orderId, in: query, schema: { type: string } }
        - { name: minAmount, in: query, schema: { type: number } }
        - { name: maxAmount, in: query, schema: { type: number } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, amount, paidAt], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Payments page with offset pagination
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Payment' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
    post:
      tags: [payments]
      summary: Initialize checkout link for an order
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/PaymentLinkInput'
                - type: object
                  required: [orderId]
                  properties: { orderId: { $ref: '#/components/schemas/Id' } }
      responses:
        '201': { description: Payment row + hosted checkoutUrl, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '409': { description: Order already paid / wrong status, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /payments/search:
    get:
      tags: [payments]
      summary: Search payments by reference, order number, customer name/phone
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Matching payments
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Payment' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  /payments/export:
    get:
      tags: [payments]
      summary: Export payments to CSV or JSON (max 10k rows)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: status, in: query, schema: { type: string, enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, REFUNDED, ABANDONED] } }
        - { name: provider, in: query, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY, BANK_TRANSFER, CASH] } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        '200':
          description: CSV file or JSON array
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Payment' } }, total: { type: integer } } }
  /payments/stats:
    get:
      tags: [payments]
      summary: Payment statistics (success rate, revenue, fees, by-provider breakdown)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: groupBy, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: Payment analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      totalPayments: { type: integer }
                      succeededPayments: { type: integer }
                      failedPayments: { type: integer }
                      refundedPayments: { type: integer }
                      successRate: { type: number }
                      totalRevenue: { type: number }
                      totalFees: { type: number }
                      avgPaymentAmount: { type: number }
                  byProvider:
                    type: array
                    items:
                      type: object
                      properties:
                        provider: { type: string }
                        count: { type: integer }
                        totalAmount: { type: number }
                  byDay:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { $ref: '#/components/schemas/DateOnly' }
                        count: { type: integer }
                        total: { type: number }
  /payments/send:
    post:
      tags: [payments]
      summary: Send payment link directly (no order context)
      description: Generates a payment link for a custom amount and optionally sends it via WhatsApp.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientPhone, amount, provider]
              properties:
                recipientPhone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                amount: { type: number, minimum: 0.01 }
                currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD], default: NGN }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY] }
                description: { type: string, maxLength: 280 }
                metadata: { type: object, additionalProperties: true }
                conversationId: { $ref: '#/components/schemas/Id' }
      responses:
        '201': { description: Payment + checkoutUrl, content: { application/json: { schema: { type: object, properties: { payment: { $ref: '#/components/schemas/Payment' }, checkoutUrl: { type: string, format: uri } } } } } }
  /payments/generate-link:
    post:
      tags: [payments]
      summary: Generate payment link for custom amount (no order context)
      description: Creates a payment link that can be shared via WhatsApp, email, or SMS.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, provider]
              properties:
                amount: { type: number, minimum: 0.01 }
                currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD], default: NGN }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY] }
                customerPhone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                customerEmail: { type: string, format: email }
                description: { type: string, maxLength: 280 }
                expiresInMinutes: { type: integer, minimum: 5, maximum: 10080, default: 1440 }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201': { description: Payment + checkoutUrl, content: { application/json: { schema: { type: object, properties: { payment: { $ref: '#/components/schemas/Payment' }, checkoutUrl: { type: string, format: uri } } } } } }
  '/payments/order/{id}':
    get:
      tags: [payments]
      summary: Get payment by order ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Payment (or null), content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  '/payments/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Payment id }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [payments]
      summary: Get payment by ID
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  '/payments/{id}/verify':
    post:
      tags: [payments]
      summary: Verify against PSP (server-side re-check; idempotent)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Authoritative status after PSP verification, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '402': { description: PAYMENT_FAILED per PSP, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payments/{id}/refund':
    post:
      tags: [payments]
      summary: Refund (full or partial) — OWNER only
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, minimum: 0.01, description: omit for full refund }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { description: Refund processed, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Already refunded / exceeds paid amount, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payments/{id}/refunds':
    get:
      tags: [payments]
      summary: List refunds for a payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED] } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, amount], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Refunds page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OrderRefund' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  '/payments/{id}/transactions':
    get:
      tags: [payments]
      summary: Payment transaction audit log (append-only)
      description: Lists every PSP state transition for this payment. Used for reconciliation and dispute resolution.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Transaction audit entries
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PaymentTransaction' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  '/payment-methods':
    get:
      tags: [payment-methods]
      summary: List merchant payout accounts (OWNER)
      responses:
        '200':
          description: Payout accounts (secrets never returned)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PaymentMethod' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [payment-methods]
      summary: Add payout account (OWNER) — number encrypted AES-256-GCM, hash for uniqueness
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethodCreate' } } } }
      responses:
        '201': { description: Created (verificationStatus PENDING), content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }
        '409': { description: Same account already exists, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payment-methods/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [payment-methods]
      summary: Get payout account (OWNER)
      responses:
        '200': { description: Account, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }
    put:
      tags: [payment-methods]
      summary: Update display fields or set default (PATCH alias)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { isDefault: { type: boolean }, accountName: { type: string }, bankCode: { type: string } } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }
    delete:
      tags: [payment-methods]
      summary: Remove payout account
      responses:
        '204': { description: Removed }
        '409': { description: Cannot remove last active account with pending payouts, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payment-methods/{id}/set-default':
    post:
      tags: [payment-methods]
      summary: Set payout account as default
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }

  # ───────────────────────────── PAYMENT REFUNDS ─────────────────────────────
  '/payments/{id}/refunds':
    get:
      tags: [payments]
      summary: List refunds for a payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED] } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, amount], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: Refund page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/OrderRefund' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
    post:
      tags: [payments]
      summary: Create a refund (partial or full)
      description: Creates a refund request. Use POST /:refundId/process to submit to PSP.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number, description: "Partial refund amount; omit for full refund" }
                reason: { type: string, maxLength: 500 }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201': { description: Refund created (PENDING), content: { application/json: { schema: { $ref: '#/components/schemas/OrderRefund' } } } }
        '422': { description: Validation error (exceeds payment amount, etc.), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payments/{id}/refunds/{refundId}':
    get:
      tags: [payments]
      summary: Get refund by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Refund, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRefund' } } } }
  '/payments/{id}/refunds/{refundId}/process':
    post:
      tags: [payments]
      summary: Process refund via PSP
      description: Submits the refund to the payment provider for processing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Refund processing, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRefund' } } } }
        '402': { description: PSP rejected the refund, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/payments/{id}/refunds/{refundId}/cancel':
    post:
      tags: [payments]
      summary: Cancel a pending refund
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: refundId, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200': { description: Refund cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/OrderRefund' } } } }

  # ───────────────────────────── COMMISSIONS ─────────────────────────────
  '/payments/commissions':
    get:
      tags: [payments]
      summary: List platform commissions (OWNER)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SETTLED, CANCELLED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Commission page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Commission' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  '/payments/commissions/summary':
    get:
      tags: [payments]
      summary: Commission summary for store (OWNER)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Commission summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPending: { type: integer }
                  totalSettled: { type: integer }
                  pendingAmount: { type: number }
                  settledAmount: { type: number }

  # ───────────────────────────── FEES ─────────────────────────────
  '/payments/fees':
    get:
      tags: [payments]
      summary: List payment processing fees (OWNER)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: type, in: query, schema: { type: string, enum: [PROCESSING, PLATFORM, CURRENCY_CONVERSION, REFUND] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, CHARGED, REFUNDED, WAIVED] } }
      responses:
        '200':
          description: Fee page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Fee' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  '/payments/fees/summary':
    get:
      tags: [payments]
      summary: Fee summary for store (OWNER)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Fee summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCharged: { type: integer }
                  totalWaived: { type: integer }
                  chargedAmount: { type: number }
                  waivedAmount: { type: number }

  # ───────────────────────────── FRAUD DETECTION ─────────────────────────────
  '/payments/fraud/flagged':
    get:
      tags: [payments]
      summary: List payments flagged by fraud detection (OWNER)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Flagged payments
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/FlaggedPayment' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
  '/payments/fraud/analyze':
    post:
      tags: [payments]
      summary: Run fraud analysis on payment data (OWNER)
      description: Returns a fraud score (0-100) with risk reasons. Scores >= 50 are flagged, >= 90 are auto-blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, provider]
              properties:
                amount: { type: number }
                currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD], default: NGN }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY, BANK_TRANSFER, CASH] }
                customerPhone: { type: string }
                metadata: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Fraud analysis result
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: integer, minimum: 0, maximum: 100 }
                  flagged: { type: boolean }
                  blocked: { type: boolean }
                  reasons: { type: array, items: { type: string } }

  # ───────────────────────────── SUBSCRIPTIONS (ENHANCED) ─────────────────────────────
  '/subscriptions/me':
    get:
      tags: [subscriptions]
      summary: Current merchant subscription
      responses:
        '200': { description: Active/trialing subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '404': { description: No subscription yet (FREE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/subscriptions/cancel':
    post:
      tags: [subscriptions]
      summary: Cancel subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
                cancelAtPeriodEnd: { type: boolean, default: true }
      responses:
        '200': { description: Cancellation applied, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
  '/subscriptions/renew':
    post:
      tags: [subscriptions]
      summary: Renew a cancelled/expired subscription
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                billingCycle: { type: string, enum: [MONTHLY, YEARLY] }
      responses:
        '200': { description: Subscription reactivated, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
  '/subscriptions/upgrade':
    post:
      tags: [subscriptions]
      summary: Upgrade to a higher plan (immediate proration)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                billingCycle: { type: string, enum: [MONTHLY, YEARLY] }
      responses:
        '200': { description: Plan changed, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
  '/subscriptions/downgrade':
    post:
      tags: [subscriptions]
      summary: Downgrade plan (takes effect at period end)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId: { type: string }
                billingCycle: { type: string, enum: [MONTHLY, YEARLY] }
      responses:
        '200': { description: Downgrade scheduled, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
  '/subscription-plans':
    get:
      tags: [subscriptions]
      summary: List subscription plans (authenticated)
      parameters:
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Plan catalog
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SubscriptionPlan' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
    post:
      tags: [subscriptions]
      summary: Create plan (SUPER_ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPlanInput' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPlan' } } } }
  '/subscription-plans/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [subscriptions]
      summary: Get plan by ID
      responses:
        '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPlan' } } } }
    patch:
      tags: [subscriptions]
      summary: Update plan (SUPER_ADMIN only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionPlanInput' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPlan' } } } }
    delete:
      tags: [subscriptions]
      summary: Delete plan (SUPER_ADMIN only)
      responses:
        '200': { description: Deleted }
        '409': { description: Plan has active subscriptions, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/subscription-plans/slug/{slug}':
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [subscriptions]
      summary: Get plan by code/slug
      responses:
        '200': { description: Plan, content: { application/json: { schema: { $ref: '#/components/schemas/SubscriptionPlan' } } } }

  # ───────────────────────────── DELIVERIES ─────────────────────────────
  /deliveries:
    get:
      tags: [deliveries]
      summary: List deliveries (legacy alias /logistics/shipments)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { type: string }, description: comma-multi DeliveryStatus }
      responses:
        '200':
          description: Page (default sort -quotedAt)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Delivery' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [deliveries]
      summary: Quote & book delivery for an order
      description: |
        Omit deliveryProviderId → platform auto-selects the cheapest live quote.
        Legacy alias POST /logistics/orders/:orderId/book.
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryCreate' } } } }
      responses:
        '201': { description: Booked, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '409': { description: Order already has delivery, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/deliveries/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    get:
      tags: [deliveries]
      summary: Get delivery
      responses:
        '200': { description: Delivery, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [deliveries]
      summary: Update recipient/address pre-pickup; cancel while QUOTED|BOOKED via status field — PATCH alias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientName: { type: string }
                recipientPhone: { type: string }
                dropoffAddress: { type: string }
                status: { $ref: '#/components/schemas/DeliveryStatus', description: only CANCELLED accepted here }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '409': { description: Immutable after pickup, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/deliveries/{id}/track':
    get:
      tags: [deliveries]
      summary: Live tracking events (provider proxy, 60 s cache)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/StoreId' }
      responses:
        '200':
          description: Timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery: { $ref: '#/components/schemas/Delivery' }
                  events: { type: array, items: { $ref: '#/components/schemas/TrackingEvent' } }
        '503': { description: PROVIDER_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/deliveries/stats':
    get:
      tags: [deliveries]
      summary: Delivery statistics
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/DateOnly' } }
      responses:
        '200':
          description: Stats by carrier/status incl. avg eta
          content: { application/json: { schema: { type: object, additionalProperties: true } } }

  # ───────────────────────────── DELIVERY PROVIDERS ─────────────────────────────
  /delivery-providers:
    get:
      tags: [delivery-providers]
      summary: Logistics registry (public to authenticated merchants)
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - { name: country, in: query, schema: { type: string }, example: NG }
        - { name: activeOnly, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Registry (offset pagination — bounded dataset)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DeliveryProvider' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [delivery-providers]
      summary: Register provider — platform admin only (X-Admin-Token)
      security: []
      parameters: [{ name: X-Admin-Token, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryProvider' } } } }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryProvider' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  '/delivery-providers/{id}':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [delivery-providers]
      summary: Provider detail
      responses:
        '200': { description: Provider, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryProvider' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [delivery-providers]
      summary: Update rates/config — platform admin only. PATCH alias.
      security: []
      parameters: [{ name: X-Admin-Token, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryProvider' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryProvider' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [delivery-providers]
      summary: Deactivate provider (history keeps carrier snapshot) — platform admin only
      security: []
      parameters: [{ name: X-Admin-Token, in: header, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────────── DELIVERY MANAGEMENT ─────────────────────────────
  /deliveries:
    get:
      tags: [deliveries]
      summary: List deliveries with filtering, search, and sorting
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: status, in: query, schema: { type: string, enum: [QUOTED, BOOKED, PICKED_UP, IN_TRANSIT, DELIVERED, FAILED, CANCELLED] } }
        - { name: carrier, in: query, schema: { type: string, enum: [GIG, KWIK, SENDY, MANUAL] } }
        - { name: search, in: query, schema: { type: string }, description: Search by tracking code, recipient name/phone, or order ID }
        - { name: dateFrom, in: query, schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, schema: { type: string, format: date-time } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, fee, status, deliveredAt], default: createdAt } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Paginated delivery list
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Delivery' } }, meta: { $ref: '#/components/schemas/OffsetPageMeta' } } } } }
    post:
      tags: [deliveries]
      summary: Book a new delivery
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryCreate' } } } }
      responses:
        '201': { description: Delivery booked, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '400': { $ref: '#/components/responses/Error' }
  '/deliveries/{id}':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [deliveries]
      summary: Delivery detail
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: Delivery detail, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [deliveries]
      summary: Update delivery metadata (recipient name, phone, package details)
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryUpdate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
  '/deliveries/{id}/cancel':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [deliveries]
      summary: Cancel an in-progress delivery
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
        '409': { description: Cannot cancel (already delivered or failed) }
  '/deliveries/{id}/rate':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [deliveries]
      summary: Rate a completed delivery
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryRateInput' } } } }
      responses:
        '200': { description: Rated, content: { application/json: { schema: { $ref: '#/components/schemas/Delivery' } } } }
  /deliveries/cost:
    post:
      tags: [deliveries]
      summary: Calculate delivery costs across all available providers
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryCostRequest' } } } }
      responses:
        '200':
          description: Cost breakdowns from each provider, sorted by total fee
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DeliveryCostBreakdown' } } } } } }
  '/deliveries/{id}/tracking':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [deliveries]
      summary: List tracking events for a delivery
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200':
          description: Tracking events (newest first)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DeliveryTrackingEvent' } } } } } }
    post:
      tags: [deliveries]
      summary: Append a tracking event (webhook handler or manual)
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryTrackingEventInput' } } } }
      responses:
        '201': { description: Event appended, content: { application/json: { schema: { $ref: '#/components/schemas/DeliveryTrackingEvent' } } } }
  '/deliveries/{id}/claims':
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [deliveries]
      summary: List claims for a delivery
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200':
          description: Claims list
