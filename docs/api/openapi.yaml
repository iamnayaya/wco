  # ───────────────────────────── WEBHOOKS / WHATSAPP / GRAPHQL ─────────────────────────────
  /webhooks:
    get:
      tags: [webhooks]
      summary: List outbound webhook subscriptions (OWNER/ADMIN)
      responses:
        '200':
          description: Subscriptions (secrets never returned)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/WebhookSubscription' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [webhooks]
      summary: Create subscription — secret returned once
      parameters: [{ $ref: '#/components/parameters/StoreId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookCreate' } } } }
      responses:
        '201':
          description: Created with whsec_… secret
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookSubscription' }
                  - { $ref: '#/components/schemas/WebhookSecretResponse' }
        '422': { description: SSRF guard — private/unresolvable host rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/webhooks/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [webhooks]
      summary: Subscription detail + recent delivery attempts
      responses:
        '200':
          description: Subscription + delivery log tail
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/WebhookSubscription' }
                  - type: object
                    properties:
                      deliveries:
                        type: array
                        items: { type: object }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [webhooks]
      summary: Update url/events/isActive (PATCH alias)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookCreate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookSubscription' } } } }
    delete:
      tags: [webhooks]
      summary: Delete subscription
      responses:
        '204': { description: Deleted }
  '/webhooks/{id}/test':
    post:
      tags: [webhooks]
      summary: Fire synthetic event through the real pipeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { description: Synchronous delivery result, content: { application/json: { example: { delivered: true, latencyMs: 214, status: 200 } } } }
        '409': { description: Endpoint currently disabled after failures, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/webhooks/{id}/rotate':
    post:
      tags: [webhooks]
      summary: Rotate signing secret (24 h dual-accept overlap)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '201': { description: New secret shown once, content: { application/json: { $ref: '#/components/schemas/WebhookSecretResponse' } } }
  /graphql:
    post:
      tags: [graphql]
      summary: GraphQL aggregation endpoint (queries only in production surface)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                variables: { type: object, additionalProperties: true }
                operationName: { type: [string, 'null'] }
      responses:
        '200': { description: GraphQL response envelope (data/errors), content: { application/json: { schema: { type: object, properties: { data: { type: object }, errors: { type: array, items: { type: object } } } } } } }
        '400': { description: Parse/validation/cost-limit errors, content: { application/json: { schema: { type: object } } } }
      externalDocs: { url: https://docs.wco.africa/api/graphql, description: schema.graphql + guidance }

  # ───────────────────────────── INBOUND PROVIDER WEBHOOKS ─────────────────────────────
  /webhooks/inbound/whatsapp:
    post:
      tags: [webhooks]
      summary: Meta WhatsApp Cloud events (X-Hub-Signature-256 HMAC)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Persisted & queued (<100 ms ack) }
        '401': { description: Bad signature, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [webhooks]
      summary: Meta verification handshake (hub.challenge echo)
      security: []
      parameters:
        - { name: hub.mode, in: query, schema: { type: string } }
        - { name: hub.verify_token, in: query, schema: { type: string } }
        - { name: hub.challenge, in: query, schema: { type: string } }
      responses:
        '200': { description: Challenge echoed when token matches }
        '403': { description: Token mismatch, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/webhooks/inbound/{provider}':
    post:
      tags: [webhooks]
      summary: PSP & logistics ingestion (paystack|flutterwave|opay|logistics/{gig|kwik|sendy})
      security: []
      parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [paystack, flutterwave, opay] } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Persisted & queued; duplicate providerEventIds ignored }
        '401': { description: Signature/token invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /webhooks/inbound/paystack:
    post:
      tags: [webhooks]
      summary: Paystack payment webhook (HMAC-SHA512, x-paystack-signature)
      security: []
      description: |
        Every Paystack event (charge.success, charge.failed, refund.processed)
        is logged to payment_webhooks for audit, then processed via
        paymentsService.handleWebhook. Returns 200 immediately — PSP retries
        on non-2xx.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Acknowledged (always 200 to prevent PSP retries) }
        '400': { description: Missing signature header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /webhooks/inbound/flutterwave:
    post:
      tags: [webhooks]
      summary: Flutterwave payment webhook (verif-hash header)
      security: []
      description: |
        Flutterwave signs with a static verif-hash header. Events are logged
        and processed asynchronously. Returns 200 to prevent retries.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Acknowledged }
        '400': { description: Missing signature header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /webhooks/inbound/opay:
    post:
      tags: [webhooks]
      summary: OPay payment webhook (HMAC-SHA512, x-opay-signature)
      security: []
      description: |
        OPay signs with HMAC-SHA512 using the merchant private key. Events
        are logged and processed. Returns 200 to prevent retries.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: Acknowledged }
        '400': { description: Missing signature header, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    apiKeyAuth: { type: apiKey, in: header, name: X-API-Key }
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            orders:read: Read orders
            products:read: Read catalog
            messages:write: Send messages
            webhooks:manage: Manage webhook subscriptions

  parameters:
    StoreId:
      name: X-Store-Id
      in: header
      required: false
      description: Active store. Required when the principal has >1 store; must be accessible to the credential.
      schema: { type: string, example: str_demo_store }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Opaque continuation token from meta.nextCursor
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQ:
      name: q
      in: query
      schema: { type: string, maxLength: 120 }
    SortBy:
      name: sortBy
      in: query
      schema: { type: string }
      description: Whitelisted field; compound allowed via comma
    Order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      schema: { type: string, format: uuid }
      description: Makes the request idempotent for 24 h
    RequestId:
      name: X-Request-ID
      in: header
      schema: { type: string }
      description: Client-generated correlation id (echoed back)

  headers:
    RateLimit-Limit: { schema: { type: integer }, description: Requests allowed per window }
    RateLimit-Remaining: { schema: { type: integer } }
    RateLimit-Reset: { schema: { type: integer }, description: Seconds until reset }
    ETag: { schema: { type: string }, example: '"v1769856000"' }
    Deprecation: { schema: { type: string }, description: Present on deprecated routes }
    Sunset: { schema: { type: string, format: date }, description: Removal date for deprecated routes }

  responses:
    Error:
      description: Error envelope (see error catalog)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            notFound:
              value: { code: NOT_FOUND, message: Order not found, requestId: req_01HQ… }
            validation:
              value:
                code: VALIDATION_ERROR
                message: Request validation failed
                requestId: req_01HQ…
                details:
                  errors:
                    - { path: body.email, code: isEmail, message: email must be an email }
    Unauthorized:
      description: Missing/expired credentials
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Insufficient role/scope or tenant mismatch
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource absent or foreign-tenant
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State precondition failed (duplicate key, stale If-Match, illegal transition)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Tier exceeded
      headers:
        Retry-After: { schema: { type: integer } }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimit-Reset' }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ---------- primitives ----------
    Id:
      type: string
      pattern: '^[a-z]{2,6}_[A-Za-z0-9]+$'
      description: Opaque prefixed id per resource type
    DateTime: { type: string, format: date-time, description: RFC 3339 UTC }
    DateOnly: { type: string, format: date }
    Money:
      type: string
      pattern: '^\d+(\.\d{1,2})?$'
      description: Major units as string — never floats
      example: '1500.50'
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, TENANT_MISMATCH, NOT_FOUND,
                 CONFLICT, INSUFFICIENT_STOCK, PAYMENT_FAILED, RATE_LIMITED,
                 IDEMPOTENCY_REPLAY_IN_FLIGHT, PROVIDER_UNAVAILABLE, INTERNAL_ERROR,
                 STALE_WRITE, STORE_SUSPENDED]
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    PageMeta:
      type: object
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        total:
          type: integer
          description: Present only on offset-style endpoints (bounded datasets)
    OffsetPageMeta:
      type: object
      description: Offset-style pagination envelope (customers v2, admin users)
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer }
        totalPages: { type: integer }
    ProductImage:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        productId: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri }
        key: { type: string }
        position: { type: integer }
        isPrimary: { type: boolean }
    ProductDiscountInput:
      type: object
      required: [code, type, value]
      properties:
        code: { type: string, maxLength: 40 }
        type: { type: string, enum: [PERCENTAGE, FIXED] }
        value: { type: number }
        startsAt: { $ref: '#/components/schemas/DateTime' }
        endsAt: { $ref: '#/components/schemas/DateTime' }
        minSubtotal: { $ref: '#/components/schemas/Money' }
        active: { type: boolean, default: true }
    ProductDiscount:
      allOf:
        - $ref: '#/components/schemas/ProductDiscountInput'
        - type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            storeId: { $ref: '#/components/schemas/Id' }
    DiscountApplyInput:
      type: object
      required: [code]
      properties:
        code: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    InventoryAdjustInput:
      type: object
      required: [type, delta]
      properties:
        type: { type: string, enum: [RESTOCK, SALE, DAMAGE, CORRECTION] }
        delta: { type: integer }
        note: { type: string }
        actorId: { $ref: '#/components/schemas/Id' }
    InventoryEntry:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        productId: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [RESTOCK, SALE, DAMAGE, CORRECTION] }
        delta: { type: integer }
        resultingQuantity: { type: integer }
        note: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CategoryV2:
      type: object
      required: [name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 80 }
        description: { type: string }
        color: { type: string }
        productsCount: { type: integer }
    TagV2:
      type: object
      required: [name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 40 }
        color: { type: string }
        productsCount: { type: integer }
    TagsReplaceInput:
      type: object
      required: [names]
      properties:
        names: { type: array, items: { type: string }, maxItems: 20 }
    ImportReport:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        failedRows: { type: array, items: { type: object, properties: { row: { type: integer }, error: { type: string } } } }
    WaSyncReport:
      type: object
      properties:
        synced: { type: integer }
        skippedNoWhatsApp: { type: integer }
        failed: { type: integer }
    AiDescribeResult:
      type: object
      properties:
        description: { type: string }
        source: { type: string, enum: [llm, heuristic] }
    AiPriceResult:
      type: object
      properties:
        suggestedPrice: { $ref: '#/components/schemas/Money' }
        rationale: { type: string }
        confidence: { type: number }
        suggestionId: { $ref: '#/components/schemas/Id' }
    CustomerTag:
      type: object
      required: [name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 40, example: VIP }
        color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$', example: '#7C3AED' }
    CustomerSegment:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, maxLength: 60 }
        description: { type: [string, 'null'] }
        isSystem: { type: boolean, description: System segments are rule-locked and undeletable }
        rule:
          type: object
          description: AND-composed matcher; empty object = manual membership only
          properties:
            minTotalSpent: { type: number }
            maxTotalSpent: { type: number }
            minOrders: { type: integer }
            maxOrders: { type: integer }
            idleDaysMin: { type: integer }
            idleDaysMax: { type: integer }
            newWithinDays: { type: integer }
            marketingOptIn: { type: boolean }
        lastComputedAt: { $ref: '#/components/schemas/DateTime' }

    # ---------- auth & identity ----------
    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken: { type: string, description: RS256 JWT, 15 min }
        refreshToken: { type: string, description: opaque, single-use rotation }
        expiresIn: { type: integer, example: 900 }
    RegisterInput:
      type: object
      required: [companyName, email, password]
      properties:
        companyName: { type: string, minLength: 2, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 10 }
        phone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
        country: { type: string, default: NG }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshInput:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string } }
    PasswordResetRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    PasswordResetConfirm:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, format: password, minLength: 10 }
    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        merchantId: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [OWNER, ADMIN, AGENT, VIEWER] }
        isActive: { type: boolean }
        lastLoginAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    UserUpdate:
      type: object
      properties:
        fullName: { type: string }
        role: { type: string, enum: [ADMIN, AGENT, VIEWER] }
        isActive: { type: boolean }
    MeProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            stores:
              type: array
              items:
                type: object
                properties: { id: { type: string }, name: { type: string }, slug: { type: string } }

    # ---------- stores ----------
    Store:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        merchantId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,48}$' }
        whatsappNumber:
          type: [string, 'null']
          description: E.164; globally unique across the platform
        currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD] }
        timezone: { type: string, example: Africa/Lagos }
        status: { type: string, enum: [ACTIVE, SUSPENDED, ARCHIVED] }
        settings: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    StoreCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,48}$' }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD], default: NGN }
        timezone: { type: string, default: Africa/Lagos }
        address: { type: string }
        city: { type: string }
        country: { type: string, default: NG }

    # ---------- customers ----------
    Customer:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        waPhone: { type: string, example: '+2348012345678' }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        tags: { type: array, items: { type: string } }
        segment: { type: [string, 'null'], description: VIP|REPEAT|NEW|CHURN_RISK — AI computed }
        sentiment: { type: [string, 'null'], enum: [POSITIVE, NEUTRAL, NEGATIVE] }
        totalSpent: { $ref: '#/components/schemas/Money' }
        ordersCount: { type: integer }
        lastOrderAt: { $ref: '#/components/schemas/DateTime' }
        marketingOptIn: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    CustomerCreate:
      type: object
      required: [waPhone]
      properties:
        waPhone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
        name: { type: string }
        email: { type: string, format: email }
        tags: { type: array, items: { type: string }, maxItems: 20 }
        marketingOptIn: { type: boolean, default: false }
        notes: { type: string }
    CustomerUpdate:
      type: object
      properties:
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        tags: { type: array, items: { type: string } }
        marketingOptIn: { type: boolean }
        notes: { type: string }

    # ---------- products ----------
    ProductStatus: { type: string, enum: [ACTIVE, DRAFT, OUT_OF_STOCK, ARCHIVED] }
    Product:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        sku: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice: { $ref: '#/components/schemas/Money' }
        costPrice: { $ref: '#/components/schemas/Money' }
        stockQuantity: { type: integer }
        lowStockThreshold: { type: integer }
        trackStock: { type: boolean }
        images: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/ProductStatus' }
        categoryId: { type: [string, 'null'] }
        variantCount: { type: integer }
        deletedAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    ProductCreate:
      type: object
      required: [sku, name, price]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice: { $ref: '#/components/schemas/Money' }
        costPrice: { $ref: '#/components/schemas/Money' }
        stockQuantity: { type: integer, default: 0 }
        lowStockThreshold: { type: integer, default: 5 }
        trackStock: { type: boolean, default: true }
        images: { type: array, items: { type: string }, maxItems: 8 }
        categoryId: { type: string }
        attributes: { type: object, additionalProperties: true }
    ProductUpdate:
      type: object
      description: Partial — omitted fields unchanged
      properties:
        name: { type: string }
        description: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        compareAtPrice: { $ref: '#/components/schemas/Money' }
        costPrice: { $ref: '#/components/schemas/Money' }
        stockQuantity: { type: integer }
        lowStockThreshold: { type: integer }
        trackStock: { type: boolean }
        images: { type: array, items: { type: string } }
        categoryId: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
        attributes: { type: object, additionalProperties: true }
    Variant:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        productId: { $ref: '#/components/schemas/Id' }
        sku: { type: string }
        name: { type: string, example: 'Red · XL' }
        price: { $ref: '#/components/schemas/Money', description: null inherits product price }
        stockQuantity: { type: integer }
        attributes: { type: object, additionalProperties: true }
        imageUrl: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ProductStatus' }
    VariantUpsert:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string }
        name: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        stockQuantity: { type: integer }
        attributes: { type: object, additionalProperties: true }
        imageUrl: { type: string }

    # ---------- orders ----------
    OrderStatus: { type: string, enum: [PENDING_PAYMENT, PAID, PROCESSING, SHIPPED, DELIVERED, CANCELLED, REFUNDED] }
    Order:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderNumber: { type: string, example: WC-7F3K9Q }
        storeId: { $ref: '#/components/schemas/Id' }
        customerId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        channel: { type: string, enum: [WHATSAPP, DASHBOARD, PAYMENT_LINK] }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        deliveryFee: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD] }
        paymentReference: { type: [string, 'null'] }
        deliveryAddress: { type: [string, 'null'] }
        paidAt: { $ref: '#/components/schemas/DateTime' }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        cancelledAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    OrderItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        productId: { $ref: '#/components/schemas/Id' }
        variantId: { type: [string, 'null'] }
        productName: { type: string, description: snapshot at purchase time }
        variantName: { type: [string, 'null'] }
        sku: { type: [string, 'null'] }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { $ref: '#/components/schemas/Money' }
    OrderCreate:
      type: object
      required: [customerId, items]
      properties:
        customerId: { $ref: '#/components/schemas/Id' }
        channel: { type: string, enum: [WHATSAPP, DASHBOARD, PAYMENT_LINK], default: DASHBOARD }
        discount: { $ref: '#/components/schemas/Money', default: '0' }
        deliveryAddress: { type: string }
        deliveryCity: { type: string }
        notes: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { $ref: '#/components/schemas/Id' }
              variantId: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 999 }
              note: { type: string }
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        reason:
          type: string
          description: required when transitioning to CANCELLED or REFUNDED
    OrderStats:
      type: object
      properties:
        range:
          type: object
          properties: { from: { $ref: '#/components/schemas/DateOnly' }, to: { $ref: '#/components/schemas/DateOnly' } }
        ordersCount: { type: integer }
        revenue: { $ref: '#/components/schemas/Money' }
        avgOrderValue: { $ref: '#/components/schemas/Money' }
        byStatus:
          type: object
          additionalProperties: { type: integer }

    # ---------- messaging ----------
    Message:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        conversationId: { $ref: '#/components/schemas/Id' }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        type: { type: string, enum: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT, LOCATION, TEMPLATE, INTERACTIVE] }
        body: { type: [string, 'null'] }
        mediaUrl: { type: [string, 'null'] }
        waMessageId: { type: [string, 'null'] }
        status: { type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED, RECEIVED] }
        sentByBot: { type: boolean }
        errorReason: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    MessageUpdateInput:
      type: object
      description: Partial — omitted fields unchanged
      properties:
        body: { type: string, maxLength: 4096 }
        status: { type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED] }
        errorReason: { type: string }
        metadata: { type: object, additionalProperties: true }
    MessageAttachment:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        messageId: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri }
        mimeType: { type: string }
        fileName: { type: [string, 'null'] }
        sizeBytes: { type: integer }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    MessageThread:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        customerId: { $ref: '#/components/schemas/Id' }
        waPhone: { type: string }
        status: { type: string, enum: [BOT, HANDLED, CLOSED], description: BOT = AI handling }
        botEnabled: { type: boolean }
        assignedUserId: { type: [string, 'null'] }
        unreadCount: { type: integer }
        lastMessageAt: { $ref: '#/components/schemas/DateTime' }
        lastMessagePreview: { type: [string, 'null'] }
    ThreadMessage:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        threadId: { $ref: '#/components/schemas/Id' }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        type: { type: string, enum: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT, LOCATION, TEMPLATE, INTERACTIVE] }
        body: { type: [string, 'null'] }
        mediaUrl: { type: [string, 'null'] }
        waMessageId: { type: [string, 'null'] }
        status: { type: string, enum: [QUEUED, SENT, DELIVERED, READ, FAILED, RECEIVED] }
        sentByBot: { type: boolean }
        errorReason: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    SendMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4096 }
        type: { type: string, enum: [TEXT, IMAGE, DOCUMENT], default: TEXT }
        mediaUrl: { type: string }
      description: Sending as an agent flips the thread to HANDLED (AI takeover off)
    ReceiveMessageInput:
      type: object
      required: [waMessageId, conversationId, direction]
      properties:
        waMessageId: { type: string }
        conversationId: { $ref: '#/components/schemas/Id' }
        direction: { type: string, enum: [INBOUND, OUTBOUND] }
        type: { type: string, enum: [TEXT, IMAGE, AUDIO, VIDEO, DOCUMENT, LOCATION, TEMPLATE, INTERACTIVE], default: TEXT }
        body: { type: string }
        mediaUrl: { type: string }
        metadata: { type: object, additionalProperties: true }
    MessageStats:
      type: object
      properties:
        totalThreads: { type: integer }
        activeThreads: { type: integer }
        botThreads: { type: integer }
        handledThreads: { type: integer }
        closedThreads: { type: integer }
        totalMessages: { type: integer }
        inboundMessages: { type: integer }
        outboundMessages: { type: integer }
        botReplies: { type: integer }
        humanReplies: { type: integer }
        openEscalations: { type: integer }
        avgResponseLatencyMs: { type: integer }
        aiResolutionRate: { type: number }
        topIntents:
          type: array
          items:
            type: object
            properties:
              intent: { type: string }
              count: { type: integer }
        messagesByDay:
          type: array
          items:
            type: object
            properties:
              date: { $ref: '#/components/schemas/DateOnly' }
              count: { type: integer }
    MessageEscalation:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        conversationId: { $ref: '#/components/schemas/Id' }
        reason: { type: string }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT] }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, DISMISSED] }
        assignedToUserId: { type: [string, 'null'] }
        resolvedByUserId: { type: [string, 'null'] }
        resolvedAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    AiIntent:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { type: [string, 'null'], description: null = system intent (read-only) }
        name: { type: string, maxLength: 80 }
        description: { type: [string, 'null'] }
        patterns: { type: array, items: { type: string }, description: regex or keyword matchers }
        responseTemplate: { type: [string, 'null'] }
        escalate: { type: boolean }
        isActive: { type: boolean }
        priority: { type: integer }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    AiConfigUpdateInput:
      type: object
      description: Partial — omitted fields unchanged. Subset validated against allow-list.
      properties:
        isEnabled: { type: boolean }
        tone: { type: string, enum: [FRIENDLY, PROFESSIONAL, PLAYFUL, CONCISE] }
        languages: { type: array, items: { type: string } }
        businessContext: { type: string }
        autoReplyEnabled: { type: boolean }
        workingHours: { type: object, additionalProperties: true }
        outOfOfficeBody: { type: string }
        escalationKeywords: { type: array, items: { type: string } }
        primaryModel: { type: string }
        fallbackModel: { type: string }
        temperature: { type: number, minimum: 0, maximum: 1 }
        maxTokens: { type: integer }
        dailyTokenBudget: { type: integer }
        semanticCacheEnabled: { type: boolean }
    AiTemplateCreateInput:
      type: object
      required: [category, templateName, body]
      properties:
        category: { type: string, enum: [GREETING, PRICE_INQUIRY, ORDER_CONFIRMATION, SHIPPING_INFO, PAYMENT_REMINDER, ABANDONED_CART, OUT_OF_STOCK, REVIEW_REQUEST, ESCALATION, CUSTOM] }
        templateName: { type: string, maxLength: 100 }
        body: { type: string, maxLength: 4096, description: '{{mustache}} variables allowed' }
        variables: { type: array, items: { type: string }, maxItems: 10 }
        language: { type: string, default: en }
        priority: { type: integer, default: 0 }
    AiIntentCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string }
        patterns: { type: array, items: { type: string }, maxItems: 20 }
        responseTemplate: { type: string }
        escalate: { type: boolean, default: false }
        priority: { type: integer, default: 0 }
    AiEscalationInput:
      type: object
      required: [conversationId, reason]
      properties:
        conversationId: { $ref: '#/components/schemas/Id' }
        reason: { type: string, maxLength: 500 }
        priority: { type: string, enum: [LOW, MEDIUM, HIGH, URGENT], default: MEDIUM }
        assignedToUserId: { $ref: '#/components/schemas/Id' }
    WhatsAppConnection:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        phoneNumberId: { type: string, description: Meta phone_number_id }
        phoneNumber: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        qualityRating: { type: [string, 'null'], enum: [GREEN, YELLOW, RED] }
        isActive: { type: boolean }
        connectedAt: { $ref: '#/components/schemas/DateTime' }
        disconnectedAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    # ---------- payments ----------
    PaymentStatus: { type: string, enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, REFUNDED, ABANDONED] }
    Payment:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderId: { type: [string, 'null'] }
        provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY, BANK_TRANSFER, CASH] }
        providerReference: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        checkoutUrl: { type: [string, 'null'], format: uri }
        failureReason: { type: [string, 'null'] }
        initializedAt: { $ref: '#/components/schemas/DateTime' }
        paidAt: { $ref: '#/components/schemas/DateTime' }
    PaymentLinkInput:
      type: object
      required: [provider]
      properties:
        provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE, OPAY] }
        callbackUrl: { type: string, format: uri }
      description: Creates a Payment row + hosted checkout link for an order
    RefundInput:
      type: object
      properties:
        amount: { $ref: '#/components/schemas/Money', description: omit → full refund }
        reason: { type: string, maxLength: 500 }
    PaymentTransaction:
      type: object
      description: Append-only audit log of PSP state transitions
      properties:
        id: { $ref: '#/components/schemas/Id' }
        paymentId: { $ref: '#/components/schemas/Id' }
        providerReference: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount: { $ref: '#/components/schemas/Money' }
        fee: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        gatewayResponse: { type: [string, 'null'] }
        metadata: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    OrderRefund:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        orderId: { $ref: '#/components/schemas/Id' }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED] }
        providerReference: { type: [string, 'null'] }
        processedAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    PaymentMethod:
      type: object
      description: Merchant payout destination. Secrets are write-only; responses expose last4 only.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [BANK_ACCOUNT, MOBILE_MONEY, USSD, CARD] }
        providerName: { type: string, example: GTBank }
        accountName: { type: string }
        accountNumberLast4: { type: string, pattern: '^\d{4}$' }
        bankCode: { type: [string, 'null'] }
        isDefault: { type: boolean }
        verificationStatus: { type: string, enum: [PENDING, VERIFIED, FAILED] }
        verifiedAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    PaymentMethodCreate:
      type: object
      required: [type, providerName, accountName, accountNumber]
      properties:
        type: { type: string, enum: [BANK_ACCOUNT, MOBILE_MONEY, USSD, CARD] }
        providerName: { type: string }
        accountName: { type: string }
        accountNumber: { type: string, minLength: 6, maxLength: 34, writeOnly: true }
        bankCode: { type: string }
        isDefault: { type: boolean, default: false }

    # ---------- commissions & fees ----------
    Commission:
      type: object
      description: Platform commission recorded per successful payment
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        paymentId: { $ref: '#/components/schemas/Id' }
        rate: { type: number, description: "e.g. 0.0200 = 2%" }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        status: { type: string, enum: [PENDING, SETTLED, CANCELLED] }
        settledAt: { $ref: '#/components/schemas/DateTime' }
        settlementRef: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    Fee:
      type: object
      description: Payment processing fee recorded per transaction
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        paymentId: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [PROCESSING, PLATFORM, CURRENCY_CONVERSION, REFUND] }
        rate: { type: [number, 'null'], description: "percentage rate" }
        flatAmount: { type: [number, 'null'], description: "flat fee" }
        calculatedAmount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        status: { type: string, enum: [PENDING, CHARGED, REFUNDED, WAIVED] }
        providerFee: { type: [number, 'null'], description: "actual PSP fee" }
        settledAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    FlaggedPayment:
      type: object
      description: Payment flagged by fraud detection
      properties:
        id: { $ref: '#/components/schemas/Id' }
        amount: { $ref: '#/components/schemas/Money' }
        provider: { type: string }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        fraudScore: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        createdAt: { $ref: '#/components/schemas/DateTime' }

    # ---------- subscription plans ----------
    SubscriptionPlanInput:
      type: object
      required: [code, name, priceMonthly, priceYearly]
      properties:
        code: { type: string, enum: [FREE, STARTER, GROWTH, SCALE] }
        name: { type: string, maxLength: 60 }
        description: { type: string, maxLength: 500 }
        priceMonthly: { type: number, minimum: 0 }
        priceYearly: { type: number, minimum: 0 }
        currency: { type: string, enum: [NGN, GHS, KES, ZAR, XOF, USD], default: NGN }
        trialDays: { type: integer, minimum: 0, maximum: 365, default: 0 }
        limits: { type: object, additionalProperties: true, default: {} }
        features: { type: array, items: { type: string }, default: [] }
        sortOrder: { type: integer, minimum: 0, default: 0 }

    # ---------- deliveries ----------
    DeliveryStatus: { type: string, enum: [QUOTED, BOOKED, PICKED_UP, IN_TRANSIT, DELIVERED, FAILED, CANCELLED] }
    Delivery:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        orderId: { $ref: '#/components/schemas/Id' }
        deliveryProviderId: { type: [string, 'null'] }
        carrier: { type: string, enum: [GIG, KWIK, SENDY, MANUAL], description: denormalized snapshot of provider code }
        trackingCode: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        recipientName: { type: [string, 'null'] }
        recipientPhone: { type: [string, 'null'] }
        fee: { $ref: '#/components/schemas/Money' }
        etaMinutes: { type: [integer, 'null'] }
        quotedAt: { $ref: '#/components/schemas/DateTime' }
        bookedAt: { $ref: '#/components/schemas/DateTime' }
        pickedUpAt: { $ref: '#/components/schemas/DateTime' }
        deliveredAt: { $ref: '#/components/schemas/DateTime' }
        proofUrl: { type: [string, 'null'], description: POD photo/signature (S3) }
    DeliveryQuote:
      type: object
      properties:
        carrier: { type: string, enum: [GIG, KWIK, SENDY] }
        providerId: { $ref: '#/components/schemas/Id' }
        fee: { $ref: '#/components/schemas/Money' }
        etaMinutes: { type: integer }
    DeliveryCreate:
      type: object
      required: [orderId]
      properties:
        orderId: { $ref: '#/components/schemas/Id' }
        deliveryProviderId: { $ref: '#/components/schemas/Id', description: omit → auto-select cheapest quote }
        recipientName: { type: string }
        recipientPhone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
    DeliveryProvider:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, example: GIG }
        name: { type: string }
        countries: { type: array, items: { type: string } }
        cities: { type: array, items: { type: string }, description: empty = nationwide }
        baseFee: { $ref: '#/components/schemas/Money' }
        perKmFee: { $ref: '#/components/schemas/Money' }
        avgEtaMinutes: { type: [integer, 'null'] }
        isActive: { type: boolean }
    TrackingEvent:
      type: object
      properties:
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        occurredAt: { $ref: '#/components/schemas/DateTime' }
        location: { type: [string, 'null'] }
        description: { type: string }
    DeliveryUpdate:
      type: object
      properties:
        recipientName: { type: string }
        recipientPhone: { type: string, pattern: '^\+[1-9]\d{6,14}$' }
        packageDescription: { type: string, maxLength: 255 }
        packageWeightKg: { type: number, minimum: 0 }
        packageLengthCm: { type: number, minimum: 0 }
        packageWidthCm: { type: number, minimum: 0 }
        packageHeightCm: { type: number, minimum: 0 }
    DeliveryCostRequest:
      type: object
      required: [pickupAddress, dropoffAddress]
      properties:
        pickupAddress: { type: string, minLength: 5 }
        dropoffAddress: { type: string, minLength: 5 }
        pickupLat: { type: number }
        pickupLng: { type: number }
        dropoffLat: { type: number }
        dropoffLng: { type: number }
        weight: { type: number, minimum: 0 }
        length: { type: number, minimum: 0 }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
        insuranceAmount: { $ref: '#/components/schemas/Money' }
    DeliveryCostBreakdown:
      type: object
      properties:
        provider: { type: string }
        rateName: { type: string }
        baseFee: { $ref: '#/components/schemas/Money' }
        distanceFee: { $ref: '#/components/schemas/Money' }
        weightFee: { $ref: '#/components/schemas/Money' }
        insuranceFee: { $ref: '#/components/schemas/Money' }
        surgeMultiplier: { type: number }
        discount: { $ref: '#/components/schemas/Money' }
        totalFee: { $ref: '#/components/schemas/Money' }
        currency: { type: string, default: NGN }
        etaMinutes: { type: integer }
    DeliveryRateInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
    DeliveryTrackingEvent:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        deliveryId: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        carrierStatus: { type: string, description: Raw carrier status before mapping }
        carrierTrackingCode: { type: string }
        carrierTimestamp: { $ref: '#/components/schemas/DateTime' }
        location: { type: [string, 'null'] }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    DeliveryTrackingEventInput:
      type: object
      required: [status, carrierTrackingCode]
      properties:
        status: { $ref: '#/components/schemas/DeliveryStatus' }
        carrierStatus: { type: string }
        carrierTrackingCode: { type: string }
        carrierTimestamp: { $ref: '#/components/schemas/DateTime' }
        location: { type: string }
        description: { type: string }
        metadata: { type: object, additionalProperties: true }
    DeliveryClaim:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        deliveryId: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        type: { type: string, enum: [LOST, DAMAGED, DELAYED, WRONG_ITEM, OTHER] }
        status: { type: string, enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED, ESCALATED] }
        description: { type: string }
        evidenceUrls: { type: array, items: { type: string, format: uri } }
        resolution: { type: [string, 'null'] }
        payoutAmount: { type: [string, 'null'], description: Refund amount if approved }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    DeliveryClaimInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [LOST, DAMAGED, DELAYED, WRONG_ITEM, OTHER] }
        description: { type: string, maxLength: 2000 }
        evidenceUrls: { type: array, items: { type: string, format: uri }, maxItems: 10 }
    DeliveryClaimProcessInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [APPROVED, REJECTED, ESCALATED] }
        resolution: { type: string, maxLength: 2000 }
        payoutAmount: { $ref: '#/components/schemas/Money' }
    DeliveryAddress:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        label: { type: string }
        contactName: { type: [string, 'null'] }
        contactPhone: { type: [string, 'null'] }
        addressLine1: { type: string }
        addressLine2: { type: [string, 'null'] }
        city: { type: string }
        state: { type: [string, 'null'] }
        country: { type: string, minLength: 2, maxLength: 2 }
        postalCode: { type: [string, 'null'] }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        isDefault: { type: boolean }
        meta: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    DeliveryAddressInput:
      type: object
      required: [label, addressLine1, city]
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        contactName: { type: string }
        contactPhone: { type: string }
        addressLine1: { type: string, minLength: 5 }
        addressLine2: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string }
        country: { type: string, minLength: 2, maxLength: 2, default: NG }
        postalCode: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        isDefault: { type: boolean, default: false }
        meta: { type: object, additionalProperties: true }
    DeliveryRateCard:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        providerId: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        baseFee: { $ref: '#/components/schemas/Money' }
        perKmFee: { $ref: '#/components/schemas/Money' }
        perKgFee: { $ref: '#/components/schemas/Money' }
        minimumFee: { $ref: '#/components/schemas/Money' }
        maximumFee: { type: [string, 'null'], description: null = no cap }
        freeThresholdKm: { type: [number, 'null'] }
        avgEtaMinutes: { type: [integer, 'null'] }
        maxWeightKg: { type: [number, 'null'] }
        maxDimensionsCm: { type: [number, 'null'] }
        isActive: { type: boolean }
        meta: { type: object, additionalProperties: true }
        provider: { $ref: '#/components/schemas/DeliveryProvider' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    DeliveryRateCardInput:
      type: object
      required: [name, baseFee]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        baseFee: { $ref: '#/components/schemas/Money' }
        perKmFee: { $ref: '#/components/schemas/Money', default: 0 }
        perKgFee: { $ref: '#/components/schemas/Money', default: 0 }
        minimumFee: { $ref: '#/components/schemas/Money', default: 0 }
        maximumFee: { $ref: '#/components/schemas/Money' }
        freeThresholdKm: { type: number, minimum: 0 }
        avgEtaMinutes: { type: integer, minimum: 0 }
        maxWeightKg: { type: number, minimum: 0 }
        maxDimensionsCm: { type: number, minimum: 0 }
        isActive: { type: boolean, default: true }
        meta: { type: object, additionalProperties: true }
    DeliveryZone:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        type: { type: string, enum: [CITY, STATE, COUNTRY, RADIUS, CUSTOM] }
        coordinates: { type: array, items: { type: array, items: { type: number } }, description: 'GeoJSON-style coordinate rings [lng, lat] pairs' }
        centerLat: { type: [number, 'null'] }
        centerLng: { type: [number, 'null'] }
        radiusKm: { type: [number, 'null'] }
        fee: { $ref: '#/components/schemas/Money' }
        etaMinutes: { type: [integer, 'null'] }
        isActive: { type: boolean }
        meta: { type: object, additionalProperties: true }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    DeliveryZoneInput:
      type: object
      required: [name, coordinates]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [CITY, STATE, COUNTRY, RADIUS, CUSTOM], default: CUSTOM }
        coordinates: { type: array, items: { type: array, items: { type: number } }, minItems: 1, description: 'GeoJSON-style coordinate rings [lng, lat] pairs' }
        centerLat: { type: number, minimum: -90, maximum: 90 }
        centerLng: { type: number, minimum: -180, maximum: 180 }
        radiusKm: { type: number, minimum: 0, maximum: 500 }
        fee: { $ref: '#/components/schemas/Money', default: 0 }
        etaMinutes: { type: integer, minimum: 0, maximum: 1440 }
        isActive: { type: boolean, default: true }
        meta: { type: object, additionalProperties: true }

    # ---------- billing ----------
    SubscriptionPlan:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, enum: [FREE, STARTER, GROWTH, SCALE] }
        name: { type: string }
        priceMonthly: { $ref: '#/components/schemas/Money' }
        priceYearly: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        trialDays: { type: integer }
        limits: { type: object, additionalProperties: true, description: ordersPerMonth, aiCredits, stores, users, products }
        features: { type: array, items: { type: string } }
        isActive: { type: boolean }
    Subscription:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        merchantId: { $ref: '#/components/schemas/Id' }
        planId: { $ref: '#/components/schemas/Id' }
        planCode: { type: string, example: GROWTH }
        status: { type: string, enum: [TRIALING, ACTIVE, PAST_DUE, PAUSED, CANCELLED, EXPIRED] }
        billingCycle: { type: string, enum: [MONTHLY, YEARLY] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        currentPeriodStart: { $ref: '#/components/schemas/DateTime' }
        currentPeriodEnd: { $ref: '#/components/schemas/DateTime' }
        trialEndsAt: { $ref: '#/components/schemas/DateTime' }
        cancelAtPeriodEnd: { type: boolean }
    SubscribeInput:
      type: object
      required: [planCode]
      properties:
        planCode: { type: string, enum: [STARTER, GROWTH, SCALE] }
        billingCycle: { type: string, enum: [MONTHLY, YEARLY], default: MONTHLY }

    # ---------- ai ----------
    AiConfiguration:
      type: object
      properties:
        storeId: { $ref: '#/components/schemas/Id' }
        isEnabled: { type: boolean }
        tone: { type: string, enum: [FRIENDLY, PROFESSIONAL, PLAYFUL, CONCISE] }
        languages: { type: array, items: { type: string }, example: [en, pcm] }
        businessContext: { type: [string, 'null'], description: seller FAQ/policies fed to prompts }
        autoReplyEnabled: { type: boolean }
        workingHours: { type: object, additionalProperties: true }
        outOfOfficeBody: { type: [string, 'null'] }
        escalationKeywords: { type: array, items: { type: string } }
        primaryModel: { type: string }
        fallbackModel: { type: string }
        temperature: { type: number, minimum: 0, maximum: 1 }
        maxTokens: { type: integer }
        dailyTokenBudget: { type: integer }
        semanticCacheEnabled: { type: boolean }
    AiResponseTemplate:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        storeId: { type: [string, 'null'], description: null = platform system template (read-only) }
        category: { type: string, enum: [GREETING, PRICE_INQUIRY, ORDER_CONFIRMATION, SHIPPING_INFO, PAYMENT_REMINDER, ABANDONED_CART, OUT_OF_STOCK, REVIEW_REQUEST, ESCALATION, CUSTOM] }
        templateName: { type: string }
        body: { type: string, description: '{{mustache}} variables allowed' }
        variables: { type: array, items: { type: string } }
        language: { type: string, default: en }
        isActive: { type: boolean }
        priority: { type: integer }
        usageCount: { type: integer }
    AiTestRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 1000 }
        customerContext:
          type: object
          additionalProperties: true
          description: optional simulated customer state (segment, lastOrder)
    AiTestResult:
      type: object
      properties:
        replyDraft: { type: string }
        intentClass: { type: string }
        confidence: { type: number }
        escalated: { type: boolean }
        tokensUsed: { type: integer }
        latencyMs: { type: integer }

    # ---------- webhooks & whatsapp ----------
    WebhookSubscription:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        url: { type: string, format: uri }
        events: { type: array, items: { type: string }, description: empty = all events }
        isActive: { type: boolean }
        description: { type: [string, 'null'] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
    WebhookCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, pattern: '^https://' }
        events:
          type: array
          items:
            type: string
            enum: [order.created, order.paid, order.shipped, order.delivered, order.cancelled,
                   payment.succeeded, payment.failed, message.received, delivery.booked,
                   subscription.renewed]
        description: { type: string }
    WebhookSecretResponse:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        secret: { type: string, example: whsec_9f2c… }
      description: Raw secret returned exactly once (creation or rotation)
    WhatsappConnectInput:
      type: object
      required: [phoneNumberId, accessToken, displayName]
      properties:
        phoneNumberId: { type: string, description: Meta phone_number_id }
        accessToken: { type: string, writeOnly: true, format: password }
        displayName: { type: string }
    WhatsappStatus:
      type: object
      properties:
        connected: { type: boolean }
        phoneNumber: { type: [string, 'null'] }
        displayName: { type: [string, 'null'] }
        qualityRating: { type: [string, 'null'], enum: [GREEN, YELLOW, RED], description: Meta quality signal }
        lastConnectedAt: { $ref: '#/components/schemas/DateTime' }

    # ---------- analytics ----------
    AnalyticsRangeQuery:
      type: object
      properties:
        from: { $ref: '#/components/schemas/DateOnly' }
        to: { $ref: '#/components/schemas/DateOnly' }
        timezone: { type: string, default: Africa/Lagos }
    DayPoint:
      type: object
      properties: { date: { $ref: '#/components/schemas/DateOnly' }, value: { type: number } }
    SalesAnalytics:
      type: object
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        ordersCount: { type: integer }
        avgOrderValue: { $ref: '#/components/schemas/Money' }
        series: { type: array, items: { $ref: '#/components/schemas/DayPoint' } }
    CustomerAnalytics:
      type: object
      properties:
        totalCustomers: { type: integer }
        newCustomers: { type: integer }
        repeatRate: { type: number }
        bySegment: { type: object, additionalProperties: { type: integer } }
    ProductAnalytics:
      type: object
      properties:
        topProducts:
          type: array
          items:
            type: object
            properties:
              productId: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              unitsSold: { type: integer }
              revenue: { $ref: '#/components/schemas/Money' }
        lowStockCount: { type: integer }
    MessageAnalytics:
      type: object
      properties:
        inboundCount: { type: integer }
        outboundCount: { type: integer }
        aiResolutionRate: { type: number, format: float }
        medianFirstReplySeconds: { type: number }
        escalationRate: { type: number }
    DashboardStats:
      type: object
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        ordersCount: { type: integer }
        newCustomers: { type: integer }
        messagesCount: { type: integer }
        aiResolutionRate: { type: number }
        conversionRate: { type: number }
        revenueSeries: { type: array, items: { $ref: '#/components/schemas/DayPoint' } }
