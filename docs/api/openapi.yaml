  # ───────────────────────────── SUBSCRIPTIONS / AI ─────────────────────────────
  /subscriptions/plans:
    get:
      tags: [subscriptions]
      summary: Public plan catalog (CDN-cached 5 min)
      security: []
      responses:
        '200':
          description: Active plans
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/SubscriptionPlan' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
  /subscriptions:
    get:
      tags: [subscriptions]
      summary: Current merchant subscription (OWNER)
      responses:
        '200': { description: Active/trialing subscription, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '404': { description: No subscription yet (FREE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [subscriptions]
      summary: Subscribe to a paid plan (OWNER) — initializes PSP checkout
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SubscribeInput' } } } }
      responses:
        '201': { description: TRIALING or checkoutUrl in meta when payment required, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
        '409': { description: Live subscription already exists (partial unique index), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [subscriptions]
      summary: Change plan/cycle or toggle cancelAtPeriodEnd (PATCH alias)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planCode: { type: string, enum: [STARTER, GROWTH, SCALE] }
                billingCycle: { type: string, enum: [MONTHLY, YEARLY] }
                cancelAtPeriodEnd: { type: boolean }
      responses:
        '200': { description: Updated (proration in meta), content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
    delete:
      tags: [subscriptions]
      summary: Cancel at period end (soft; reactivate via PUT)
      responses:
        '200': { description: cancelAtPeriodEnd=true applied, content: { application/json: { schema: { $ref: '#/components/schemas/Subscription' } } } }
  '/ai-configs':
    get:
      tags: [ai-configs]
      summary: Get store AI configuration
      parameters: [{ $ref: '#/components/parameters/StoreId' }]
      responses:
        '200': { description: Config (created on first access), headers: { ETag: { $ref: '#/components/headers/ETag' } }, content: { application/json: { schema: { $ref: '#/components/schemas/AiConfiguration' } } } }
    put:
      tags: [ai-configs]
      summary: Update AI brain settings (OWNER/ADMIN; PATCH alias) — invalidates Redis cache
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: If-Match, in: header, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiConfiguration', description: subset — model names validated against allow-list } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AiConfiguration' } } } }
        '409': { description: STALE_WRITE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/ai-configs/test':
    post:
      tags: [ai-configs]
      summary: Sandbox a customer message through current config (tier ai-test — 10/min/store)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiTestRequest' } } } }
      responses:
        '200': { description: Draft reply + diagnostics (no message persisted), content: { application/json: { schema: { $ref: '#/components/schemas/AiTestResult' } } } }
        '429': { description: LLM budget guardrail, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/ai-configs/responses':
    get:
      tags: [ai-configs]
      summary: List templates (store + system where storeId null)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { name: category, in: query, schema: { type: string } }
        - { name: language, in: query, schema: { type: string }, example: en }
        - { name: includeSystem, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Templates page
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AiResponseTemplate' } }, meta: { $ref: '#/components/schemas/PageMeta' } } } } }
    post:
      tags: [ai-configs]
      summary: Create store template (system templates read-only)
      parameters:
        - { $ref: '#/components/parameters/StoreId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiResponseTemplate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AiResponseTemplate' } } } }
        '409': { description: Duplicate name in store, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  '/ai-configs/responses/{id}':
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/StoreId' }
    put:
      tags: [ai-configs]
      summary: Update template (PATCH alias; system templates → 403)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AiResponseTemplate' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AiResponseTemplate' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [ai-configs]
      summary: Delete store template
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

